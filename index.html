<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>어디갈래</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="전국 시·군별 관광지, 추천 코스, 이동시간, 주변 맛집과 최신 여행 영상을 한곳에서.">
<meta name="theme-color" content="#12907A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-48.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 한 손으로 쓰는 세로 앱. 마스코트 '어디냥'(위치 핀을 꽂은 크림색 고양이)이 브랜드.
   색은 아이콘에서: 청록 바탕, 크림 얼굴, 핀 코럴, 볼터치 핑크. 둥글고 말랑한 카드. */
:root {
  --paper: #F1F8F5;
  --surface: #FFFFFF;
  --ink: #1C2422;
  --muted: #5B6B67;
  --line: #DCE8E3;
  --celadon: #12907A;
  --celadon-deep: #0B6E61;
  --celadon-ink: #FFFFFF;
  --celadon-soft: #DFF2EB;
  --cream: #FFF3DC;
  --vermilion: #E4503A;
  --blush: #F7A39A;
  --ochre: #B7791F;
  --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --radius: 20px;
  --shadow: 0 1px 2px rgba(11, 110, 97, .08), 0 8px 24px rgba(11, 110, 97, .10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1715; --surface: #16211F; --ink: #E7EFEC; --muted: #9AABA7; --line: #26332F;
    --celadon: #3CC4A6; --celadon-deep: #1C8C77; --celadon-ink: #0E1715; --celadon-soft: #18302A; --cream: #2B261D;
    --vermilion: #F07A62; --blush: #E58D84; --ochre: #E0AE52;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1715; --surface: #16211F; --ink: #E7EFEC; --muted: #9AABA7; --line: #26332F;
  --celadon: #3CC4A6; --celadon-deep: #1C8C77; --celadon-ink: #0E1715; --celadon-soft: #18302A; --cream: #2B261D;
  --vermilion: #F07A62; --blush: #E58D84; --ochre: #E0AE52;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font: 16px/1.6 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--celadon); outline-offset: 2px; border-radius: 6px; }
img { max-width: 100%; }
[hidden] { display: none !important; }

.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.topbar .inner {
  max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 12px; min-height: 58px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 26px; text-decoration: none; color: var(--celadon); }
.brand img { width: 36px; height: auto; display: block; }
.topbar .sub { color: var(--muted); font-size: 14px; margin-left: auto; white-space: nowrap; }
.back { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 12px 4px; cursor: pointer; color: var(--ink); font-size: 16px; font-weight: 600; }
.back:hover { color: var(--ink); }

/* ── 홈 ── */
.intro { padding-block: 28px 8px; }
.hero-card {
  position: relative; margin-top: 18px; padding: 24px 22px 26px; padding-right: 150px; border-radius: 28px; overflow: hidden;
  background: linear-gradient(160deg, #22B79A 0%, #12907A 55%, #0B6E61 100%); color: #fff; box-shadow: var(--shadow);
}
.hero-card::before { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 80% at 10% 0%, rgba(255,255,255,.22), transparent 55%); pointer-events: none; }
.hero-card h1 { position: relative; font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 8.4vw, 40px); line-height: 1.2; margin: 0 0 8px; text-wrap: balance; }
.hero-card p { position: relative; margin: 0; font-size: 15px; line-height: 1.55; opacity: .92; }
.hero-card .mascot { position: absolute; right: 10px; bottom: -14px; width: 138px; height: auto; filter: drop-shadow(0 8px 14px rgba(0,0,0,.18)); transform-origin: 50% 90%; }
@media (prefers-reduced-motion: no-preference) {
  .hero-card .mascot { animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: rotate(-3deg) translateY(0); } 50% { transform: rotate(3deg) translateY(-4px); } }
}
.intro h1 { font-family: var(--font-display); font-size: clamp(30px, 8vw, 38px); line-height: 1.3; margin: 0 0 6px; text-wrap: balance; font-weight: 400; }
.intro p { margin: 0; color: var(--muted); }
.search { position: relative; margin-top: 18px; }
.search input {
  width: 100%; font: inherit; font-size: 17px; padding: 15px 14px 15px 44px;
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink);
}
.search input:focus { outline: none; border-color: var(--celadon); box-shadow: 0 0 0 3px var(--celadon-soft); }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 14px 0 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 999px;
  font-size: 15px; font-weight: 500; cursor: pointer; white-space: nowrap; min-height: 42px;
}
.chip[aria-pressed="true"] { background: var(--celadon); color: var(--celadon-ink); border-color: var(--celadon); font-weight: 700; }
.section-label { font-size: 14px; letter-spacing: 0.06em; color: var(--muted); margin: 26px 0 10px; font-weight: 600; }
.ready { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.city-card {
  display: flex; flex-direction: column; text-align: left; border: 0; padding: 0; cursor: pointer;
  background: var(--surface); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
}
.city-card:hover .art { filter: saturate(1.15); }
.city-card .body { padding: 10px 12px 12px; display: grid; gap: 2px; }
.city-card .name { font-family: var(--font-display); font-weight: 400; font-size: 22px; }
.city-card .meta { color: var(--muted); font-size: 13.5px; }
.art {
  position: relative; aspect-ratio: 4 / 3; width: 100%; max-width: 100%; overflow: hidden;
  display: grid; place-items: center; color: rgba(255,255,255,.92);
  font-family: var(--font-display); font-weight: 400;
}
.art img:not(.glyph) { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.art .glyph, .rthumb .rglyph { width: 34%; max-width: 110px; opacity: .9; filter: drop-shadow(0 4px 10px rgba(0,0,0,.15)); }
.badge { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .02em; padding: 2px 7px; border-radius: 6px; background: var(--celadon-soft); color: var(--celadon); }
.rank { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: color-mix(in srgb, var(--vermilion) 12%, transparent); color: var(--vermilion); font-variant-numeric: tabular-nums; vertical-align: 2px; margin-left: 6px; }
.rank.hot { background: color-mix(in srgb, var(--ochre) 16%, transparent); color: var(--ochre); }
.buzz { font-size: 12.5px; color: var(--ochre); font-weight: 600; font-variant-numeric: tabular-nums; }
.badge.warn { background: color-mix(in srgb, var(--ochre) 16%, transparent); color: var(--ochre); }

.weekly { margin-top: 20px; }
.weekly-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.weekly-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 28px; margin: 0; display: flex; align-items: center; gap: 6px; }
.weekly-head h2 img { width: 30px; height: auto; }
.weekly-head .wk { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.weekly .chips { padding-top: 10px; }
.weekly-desc { font-size: 14.5px; color: var(--muted); margin: 6px 0 10px; }
.rank-grid { list-style: none; margin: 4px 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; }
.rank-card { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.rthumb { position: relative; display: grid; place-items: center; aspect-ratio: 4 / 5; max-width: 100%; border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; text-decoration: none; }
.rthumb img:not(.rglyph) { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

.rthumb::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.35) 0%, transparent 35%, transparent 70%, rgba(0,0,0,.35) 100%); pointer-events: none; }
.rthumb .no { position: absolute; left: 12px; top: 6px; z-index: 1; font-family: var(--font-display); font-weight: 400; font-size: 38px; line-height: 1.2; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.45); font-variant-numeric: tabular-nums; }
.rthumb .chg { position: absolute; right: 8px; top: 10px; z-index: 1; margin: 0; padding: 2px 7px; border-radius: 999px; background: rgba(255,255,255,.92); }
.rplay { position: absolute; right: 8px; bottom: 8px; z-index: 1; width: 30px; height: 30px; border-radius: 50%; background: rgba(10,16,15,.7); color: #fff; display: grid; place-items: center; }
.rplay svg { width: 13px; height: 13px; }
.rbody { display: grid; gap: 2px; text-decoration: none; min-width: 0; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; }
.city-top { margin: 18px 0 8px; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(4, 1fr);
  background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(10px);
  border-top: 1px solid var(--line); box-shadow: 0 -2px 10px rgba(11, 110, 97, .06);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px));
}
.tabbar button { border: 0; background: none; padding: 5px 0 4px; display: grid; justify-items: center; gap: 0; cursor: pointer; color: var(--muted); font-size: 11px; font-weight: 600; line-height: 1.3; min-height: 46px; }
.tabbar svg { width: 21px; height: 21px; }
.tabbar button[aria-current="page"] { color: var(--celadon); }
.wrap { padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px)) !important; }
.page-head { padding-block: 22px 4px; }
.page-head h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 8vw, 38px); margin: 0 0 6px; display: flex; align-items: center; gap: 8px; }
.page-head h1 img { width: 40px; height: auto; }
.page-head p { margin: 0; color: var(--muted); }
.about { display: grid; gap: 14px; margin-top: 16px; }
.about-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; }
.about-card h3 { margin: 0 0 6px; font-size: 17px; }
.about-card p, .about-card li { margin: 0; color: var(--muted); font-size: 15px; }
.about-card ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.about-card a { color: var(--celadon); font-weight: 600; text-decoration: none; }
.stamp-btn { display: inline-flex; align-items: center; gap: 6px; margin: 8px 0 4px; padding: 7px 14px 7px 8px; border-radius: 999px;
  border: 2px dashed var(--celadon); background: transparent; color: var(--celadon); font-weight: 700; font-size: 15px; cursor: pointer; width: fit-content; }
.stamp-btn img { width: 26px; height: auto; filter: grayscale(1) opacity(.55); }
.stamp-btn.on { border-style: solid; background: var(--celadon); color: var(--celadon-ink); }
.stamp-btn.on img { filter: none; }
.stamp-hero { margin-top: 14px; padding: 20px; border-radius: 24px; color: #fff; display: grid; gap: 8px;
  background: linear-gradient(160deg, #22B79A 0%, #12907A 55%, #0B6E61 100%); box-shadow: var(--shadow); }
.stamp-count { display: flex; align-items: baseline; gap: 8px; font-family: var(--font-display); }
.stamp-count b { font-weight: 400; font-size: 64px; line-height: 1; }
.stamp-count span { font-size: 22px; opacity: .85; }
.stamp-level { font-family: var(--font-display); font-size: 24px; color: #FFF3DC; display: grid; }
.stamp-level small { font-family: var(--font-body); font-size: 14px; color: #fff; opacity: .85; }
.stamp-bar { height: 12px; border-radius: 999px; background: rgba(255,255,255,.25); overflow: hidden; }
.stamp-bar span { display: block; height: 100%; background: #FFF3DC; border-radius: 999px; }
.stamp-share { justify-self: start; margin-top: 6px; }
.stamp-share:disabled { opacity: .6; cursor: default; }
.stamp-prov { margin-top: 20px; }
.stamp-prov h3 { margin: 0 0 10px; font-size: 17px; display: flex; gap: 8px; align-items: baseline; }
.stamp-prov h3 small { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.wrap { overflow-x: clip; }
.stamps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.stamp { aspect-ratio: 1 / 1; max-width: 100%; border-radius: 50%; border: 2px dashed var(--line); background: var(--surface); color: var(--muted);
  display: grid; place-items: center; align-content: center; gap: 0; font-size: 13.5px; font-weight: 600; cursor: pointer; padding: 4px; line-height: 1.2; }
.stamp img { width: 46%; height: auto; }
.stamp.on { border: 3px solid var(--vermilion); color: var(--vermilion); background: color-mix(in srgb, var(--vermilion) 8%, var(--surface)); transform: rotate(-6deg); }
@media (prefers-reduced-motion: no-preference) { .stamp.on { animation: stampIn .25s ease-out; } @keyframes stampIn { from { transform: scale(1.3) rotate(-6deg); opacity: .4; } } }
.half-tag { display: inline-block; width: fit-content; padding: 3px 10px; border-radius: 999px; background: var(--vermilion); color: #fff; font-size: 13px; font-weight: 700; }
.half-tag.sm { font-size: 11px; padding: 2px 7px; margin-top: 2px; }
.half-card { margin-top: 10px; padding: 14px 16px; border-radius: 18px; display: grid; gap: 4px;
  background: color-mix(in srgb, var(--vermilion) 9%, var(--surface)); border: 1.5px solid color-mix(in srgb, var(--vermilion) 35%, transparent); }
.half-card b { font-size: 15.5px; line-height: 1.45; }
.half-card span:not(.half-tag) { color: var(--muted); font-size: 14px; }
.half-card a { color: var(--vermilion); font-weight: 700; text-decoration: none; font-size: 14.5px; }
.half-home { width: 100%; margin-top: 14px; padding: 14px 16px; border-radius: 18px; text-align: left; cursor: pointer; display: grid; gap: 4px;
  background: color-mix(in srgb, var(--vermilion) 9%, var(--surface)); border: 1.5px solid color-mix(in srgb, var(--vermilion) 35%, transparent); color: var(--ink); }
.half-home b { font-size: 16.5px; }
.half-home span:not(.half-tag) { color: var(--muted); font-size: 14px; }
.half-dot { margin-left: 5px; font-size: 11px; font-weight: 700; color: #fff; background: var(--vermilion); border-radius: 999px; padding: 1px 6px; vertical-align: 1px; }
.home-more { display: flex; justify-content: center; margin: 18px 0 4px; }
.btn-ghost { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 11px 20px; font-size: 15.5px; font-weight: 600; cursor: pointer; box-shadow: var(--shadow); }
.map-sec { margin-top: 22px; }
.hotmap { aspect-ratio: 1 / 1; width: 100%; max-width: 100%; height: auto; touch-action: pan-y; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); background: var(--celadon-soft); position: relative; z-index: 0; }
.hotmap .leaflet-tile-pane { filter: saturate(.75) brightness(1.03); }
.hotmap.dark-tiles .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6); }
.map-wait { margin: 0; padding: 40px 16px; text-align: center; color: var(--muted); }
.mpin { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--vermilion); color: #fff;
  font: 400 16px/1 var(--font-display); border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
.mpin.top { width: 34px; height: 34px; margin: -2px; font-size: 18px; }
.mpop { display: grid; gap: 3px; font: 14px/1.45 var(--font-body); color: #1C2422; min-width: 180px; }
.mpop img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; margin-bottom: 4px; }
.mpop b { font-size: 15.5px; }
.mpop span { color: #5B6B67; font-size: 13px; }
.mpop .mweek { color: #E4503A; font-weight: 600; }
.mpop .mlinks { display: flex; gap: 12px; margin-top: 4px; }
.mpop a { color: #12907A; font-weight: 600; text-decoration: none; }
.spot { scroll-margin-top: calc(70px + env(safe-area-inset-top, 0px)); transition: box-shadow .3s; }
.spot.flash { box-shadow: 0 0 0 3px var(--celadon), var(--shadow); }
.rname { font-weight: 700; font-size: 17px; line-height: 1.3; overflow-wrap: anywhere; }
.rmeta { font-size: 14px; color: var(--muted); }
.rstat { font-size: 13.5px; color: var(--ochre); font-weight: 600; font-variant-numeric: tabular-nums; }
.chg { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.chg.up { color: var(--vermilion); } .chg.down { color: var(--muted); } .chg.new { color: var(--celadon); }
.province { margin-top: 22px; }
.province h3 { font-size: 14px; margin: 0 0 8px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
.province h3 small { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.names { display: flex; flex-wrap: wrap; gap: 6px; }
.name-btn {
  border: 1px solid var(--line); background: transparent; padding: 9px 14px; border-radius: 10px; font-size: 15.5px; cursor: pointer; min-height: 42px;
}
.name-btn.has { border-color: var(--celadon); color: var(--celadon); background: var(--celadon-soft); font-weight: 600; }
.name-btn:hover { border-color: var(--ink); }
.empty-note { color: var(--muted); padding: 24px 0; }

/* ── 도시 ── */
.hero { padding-block: 22px 6px; display: grid; gap: 4px; }
.hero .prov { color: var(--muted); font-size: 13px; letter-spacing: .04em; }
.hero h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(34px, 9vw, 46px); line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
.hero .meta { color: var(--muted); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.notice {
  margin-top: 12px; padding: 10px 12px; border-radius: 10px; font-size: 13.5px;
  background: color-mix(in srgb, var(--ochre) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--ochre) 35%, transparent);
}
.tabs { display: flex; gap: 4px; margin-top: 16px; border-bottom: 1px solid var(--line); }
.tab {
  flex: 1; border: 0; background: none; padding: 14px 8px; cursor: pointer; font-size: 17px; color: var(--muted);
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--celadon); font-weight: 600; }
.tab small { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 400; margin-left: 3px; }
.panel { padding-top: 16px; }

/* 코스 */
.course-pick { display: flex; gap: 8px; flex-wrap: wrap; }
.course-summary { color: var(--muted); margin: 10px 0 0; font-size: 14px; }
.days { display: inline-flex; margin-top: 14px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.days button { border: 0; background: var(--surface); padding: 10px 20px; cursor: pointer; font-size: 16px; }
.days button + button { border-left: 1px solid var(--line); }
.days button[aria-pressed="true"] { background: var(--celadon); color: var(--celadon-ink); font-weight: 600; }
.course-grid { display: grid; gap: 18px; margin-top: 16px; }
@media (min-width: 680px) { .course-grid { grid-template-columns: minmax(0, 1fr) 260px; align-items: start; } .sketch { position: sticky; top: 72px; } }
.sketch { background: var(--surface); box-shadow: var(--shadow); border-radius: var(--radius); padding: 10px; }
.sketch svg { display: block; width: 100%; height: auto; }
.sketch .cap { font-size: 12px; color: var(--muted); margin: 6px 2px 0; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.sketch .cap a { color: var(--celadon); text-decoration: none; font-weight: 600; }

.line { list-style: none; margin: 0; padding: 0; position: relative; }
.stop { display: grid; grid-template-columns: 34px minmax(0, 1fr); column-gap: 12px; position: relative; }
.stop .rail { position: relative; display: flex; justify-content: center; }
.stop .rail::before { content: ""; position: absolute; top: 0; bottom: 0; width: 4px; background: var(--celadon); border-radius: 2px; }
.stop:first-child .rail::before { top: 14px; }
.stop:last-child .rail::before { bottom: auto; height: 14px; }
.dot {
  position: relative; z-index: 1; width: 28px; height: 28px; border-radius: 50%; margin-top: 2px;
  background: var(--surface); border: 4px solid var(--celadon); display: grid; place-items: center;
  font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.stop.meal .dot { border-radius: 8px; border-color: var(--vermilion); width: 24px; height: 24px; margin-top: 4px; font-size: 0; }
.stop.meal .dot::after { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--vermilion); }
.stop .content { padding-bottom: 16px; min-width: 0; }
.stop h4 { margin: 2px 0 2px; font-size: 18px; font-weight: 600; line-height: 1.45; }
.stop.meal h4 { font-size: 15px; font-weight: 500; }
.stop .note { color: var(--ochre); font-size: 13px; font-weight: 500; }
.stop .desc { color: var(--muted); font-size: 14.5px; margin: 2px 0 0; }
.links { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; font-size: 15px; }
.links a { color: var(--celadon); text-decoration: none; font-weight: 500; }
.links a:hover { text-decoration: underline; }
.leg { display: grid; grid-template-columns: 34px minmax(0, 1fr); column-gap: 12px; }
.leg .rail { display: flex; justify-content: center; position: relative; }
.leg .rail::before { content: ""; position: absolute; top: 0; bottom: 0; width: 4px; background: repeating-linear-gradient(var(--celadon) 0 6px, transparent 6px 11px); border-radius: 2px; }
.leg .info {
  margin: 0 0 14px; padding: 9px 12px; border-radius: 10px; background: var(--celadon-soft);
  font-size: 14.5px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-variant-numeric: tabular-nums;
}
.leg .info b { font-weight: 600; color: var(--celadon); }
.leg .info a { color: var(--ink); text-decoration: none; margin-left: auto; font-weight: 500; }
.leg .info a:hover { text-decoration: underline; }
.estimate-note { font-size: 12.5px; color: var(--muted); margin-top: 4px; }

/* 관광지 */
.spots { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.spot { background: var(--surface); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.spot .photo { display: block; text-decoration: none; position: relative; }
.spot .art { aspect-ratio: 16 / 9; }
.play {
  position: absolute; right: 10px; bottom: 10px; display: inline-flex; align-items: center; gap: 6px;
  background: rgba(10, 16, 15, .72); color: #fff; font-family: var(--font-body); font-size: 12.5px; font-weight: 600;
  padding: 5px 10px 5px 8px; border-radius: 999px;
}
.play svg { width: 14px; height: 14px; }
.spot .body { padding: 12px 14px 14px; display: grid; gap: 4px; }
.spot h4 { margin: 0; font-size: 19px; font-weight: 700; }
.spot .addr { color: var(--muted); font-size: 12.5px; }
.spot .desc { font-size: 15px; margin: 2px 0 0; }
.vids { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
.vids a { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 10px; text-decoration: none; align-items: center; }
.vids .th { aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; background: var(--celadon-soft); max-width: 100%; }
.vids .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.vids .t { font-size: 13px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.vids .c { font-size: 11.5px; color: var(--muted); }

/* 맛집 */
.foods { display: grid; gap: 10px; }
.food { background: var(--surface); box-shadow: var(--shadow); border-radius: 16px; padding: 12px 14px; display: grid; gap: 2px; }
.food h4 { margin: 0; font-size: 18px; font-weight: 600; }
.food .addr, .food .near { font-size: 13px; color: var(--muted); }
.empty-card { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 10px; }
.empty-card h4 { margin: 0; font-size: 16px; }
.empty-card p { margin: 0; color: var(--muted); font-size: 14px; }
.specialties { display: flex; flex-wrap: wrap; gap: 6px; }
.specialties a { text-decoration: none; padding: 6px 12px; border-radius: 999px; background: var(--celadon-soft); color: var(--celadon); font-weight: 600; font-size: 14px; }
.btn-link { display: inline-flex; width: fit-content; align-items: center; gap: 6px; text-decoration: none; padding: 9px 14px; border-radius: 10px; background: var(--celadon); color: var(--celadon-ink); font-weight: 600; font-size: 14px; }

.credit { color: var(--muted); font-size: 12px; margin-top: 36px; border-top: 1px solid var(--line); padding-top: 12px; }
.loading { color: var(--muted); padding: 56px 0; display: grid; justify-items: center; gap: 12px; text-align: center; font-size: 16px; }
.loading img { width: 96px; height: auto; }
@media (prefers-reduced-motion: no-preference) { .loading img { animation: bob 1.4s ease-in-out infinite; } }
.empty-cat { width: 110px; height: auto; justify-self: center; }
@media (prefers-reduced-motion: no-preference) {
  .panel { animation: rise .22s ease-out both; }
  @keyframes rise { from { transform: translateY(4px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>
</head>
<body>
<header class="topbar"><div class="inner" id="topbar"></div></header>
<main class="wrap" id="app"><p class="loading"><img src="icons/mascot-160.png" alt="">어디냥이 길을 찾는 중이에요…</p></main>
<nav class="tabbar" id="tabbar" aria-label="메뉴">
  <button data-view="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3z" fill="currentColor"/></svg><span>홈</span></button>
  <button data-view="map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z" fill="currentColor"/></svg><span>핫플 지도</span></button>
  <button data-view="cities"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><span>도시 찾기</span></button>
  <button data-view="me"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="m8 12.5 2.6 2.6L16.5 9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>내 여행</span></button>
</nav>

<script>
(() => {
  const app = document.getElementById("app");
  const topbar = document.getElementById("topbar");
  const state = { index: null, prov: "전체", q: "", city: null, tab: "course", course: 0, day: 0, sort: "hot", weekly: null, list: "youtube" };
  const cityCache = new Map();

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const enc = encodeURIComponent;
  // 반값여행(지역사랑 휴가지원) 시행 지역
  const halfOf = (id) => (state.half?.regions || []).find((r) => r.id === id && r.active);
  function halfBanner(id) {
    const h = halfOf(id);
    if (!h) return "";
    return `<div class="half-card">
      <span class="half-tag">반값여행</span>
      <b>${esc(state.half.benefit)}</b>
      <span>${esc(h.note)} · ${esc(state.half.howto)}</span>
      <a href="${esc(state.half.applyUrl)}" target="_blank" rel="noopener">신청 방법 보기 (대한민국 구석구석) ↗</a>
    </div>`;
  }
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* 저장 불가 환경 */ } },
  };
  // 다녀온 도시(도장): 이 휴대폰에만 저장
  const visited = new Set((() => { try { return JSON.parse(store.get("visited") || "[]"); } catch { return []; } })());
  const saveVisited = () => store.set("visited", JSON.stringify([...visited]));
  const LEVELS = [[0, "여행 새싹"], [3, "동네 탐험가"], [10, "주말 여행러"], [25, "지역 여행가"], [50, "전국 유랑자"], [100, "국토 대장정"], [161, "전국 정복"]];
  const levelOf = (n) => LEVELS.filter(([k]) => n >= k).pop()[1];
  const nextLevel = (n) => LEVELS.find(([k]) => k > n);
  function stampBtn(id) {
    const on = visited.has(id);
    return `<button class="stamp-btn${on ? " on" : ""}" data-stamp="${esc(id)}" aria-pressed="${on}">
      <img src="icons/mascot-160.png" alt="">${on ? "도장 쾅! 다녀온 곳" : "다녀왔어요"}</button>`;
  }

  // ── 거리·이동시간 추정 (직선거리 × 도로 보정) ──
  function km(a, b) {
    const R = 6371, r = Math.PI / 180;
    const dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function estimate(a, b) {
    const road = km(a, b) * 1.3;
    if (road <= 1.5) return { mode: "도보", min: Math.max(3, Math.round(road / 4.2 * 60)), km: road };
    const speed = road < 10 ? 25 : road < 40 ? 45 : 65;
    return { mode: "차량", min: Math.round(road / speed * 60 + 5), km: road };
  }
  const fmtMin = (m) => m >= 60 ? `${Math.floor(m / 60)}시간 ${m % 60 ? (m % 60) + "분" : ""}`.trim() : `${m}분`;
  const fmtKm = (k) => k < 1 ? `${Math.round(k * 1000 / 50) * 50}m` : `${k.toFixed(1)}km`;
  const safeName = (s) => String(s).replace(/[,/]/g, " ");

  // ── 외부 링크 ──
  const baseCity = (name) => name.replace(/(특별자치시|특별자치도|광역시|특별시|시|군)$/, "");
  const ytSearch = (city, spot) => `https://www.youtube.com/results?search_query=${enc(`${baseCity(city)} ${spot} 여행`)}`;
  const ytWatch = (id) => `https://www.youtube.com/watch?v=${enc(id)}`;
  const igTag = (spot) => `https://www.instagram.com/explore/tags/${enc(spot.replace(/\s+/g, ""))}/`;
  const kakaoPin = (p) => p.kakao ? `https://place.map.kakao.com/${enc(p.kakao)}`
    : p.lat != null ? `https://map.kakao.com/link/map/${enc(safeName(p.name))},${p.lat},${p.lng}`
    : kakaoSearch(`${baseCity(state.city?.name || "")} ${p.name}`);
  const fmtViews = (n) => n >= 1e8 ? `${(n / 1e8).toFixed(1)}억` : n >= 1e4 ? `${Math.round(n / 1e4).toLocaleString()}만` : n.toLocaleString();
  const kakaoRoute = (a, b) => `https://map.kakao.com/link/from/${enc(safeName(a.name))},${a.lat},${a.lng}/to/${enc(safeName(b.name))},${b.lat},${b.lng}`;
  const kakaoSearch = (q) => `https://map.kakao.com/?q=${enc(q)}`;

  // ── 사진 대체 그림: 이름으로 색을 정해 이니셜을 얹는다 ──
  const ART_HUES = [166, 172, 160, 178, 154, 184, 168];
  function hash(s) { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.codePointAt(0)) >>> 0; return h; }
  function artBg(seed) {
    const h = ART_HUES[hash(seed) % ART_HUES.length];
    return `background: linear-gradient(160deg, hsl(${h} 62% 46%), hsl(${(h + 6) % 360} 80% 24%));`;
  }
  function art(seed, label, img) {
    const pic = img ? `<img src="${esc(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : "";
    return `<div class="art" style="${artBg(seed)}"><img class="glyph" src="icons/mascot-160.png" alt="">${pic}</div>`;
  }
  const playIcon = `<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M4 2.5v11l9-5.5z"/></svg>`;

  // ── 데이터 ──
  async function loadIndex() {
    const [r, w, hp] = await Promise.all([
      fetch("data/cities.json", { cache: "no-cache" }),
      fetch("data/weekly.json", { cache: "no-cache" }).catch(() => null),
      fetch("data/halfprice.json", { cache: "no-cache" }).catch(() => null),
    ]);
    try { state.half = hp && hp.ok ? await hp.json() : null; } catch { state.half = null; }
    if (!r.ok) throw new Error("도시 목록을 불러오지 못했어요.");
    state.index = await r.json();
    try { state.weekly = w && w.ok ? await w.json() : null; } catch { state.weekly = null; }
  }
  async function loadCity(id) {
    if (cityCache.has(id)) return cityCache.get(id);
    const r = await fetch(`data/cities/${id}.json`, { cache: "no-cache" });
    if (!r.ok) return null;
    const d = await r.json();
    d.spotMap = new Map(d.spots.map((s) => [s.id, s]));
    d.foodMap = new Map((d.restaurants || []).map((f) => [f.id, f]));
    cityCache.set(id, d);
    return d;
  }

  // ── 라우팅: #도시id ──
  function go(id) {
    if (id) { if (location.hash !== "#" + id) history.pushState(null, "", "#" + id); }
    else history.pushState(null, "", location.pathname + location.search);
    route();
  }
  window.addEventListener("popstate", route);

  async function route() {
    const id = decodeURIComponent(location.hash.slice(1));
    const city = id && state.index.cities.find((c) => c.id === id);
    if (city) { setTabbar("cities"); await showCity(city); }
    else showHome(VIEWS.includes(id) ? id : "home");
    window.scrollTo({ top: 0 });
  }

  // ── 메뉴(하단 바): 홈 · 핫플 지도 · 도시 찾기 · 더보기 ──
  const VIEWS = ["map", "cities", "about", "me"];
  function setTabbar(view) {
    document.querySelectorAll("#tabbar [data-view]").forEach((b) => {
      if (b.dataset.view === view) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
  }
  function homeTopbar() {
    const total = state.index.cities.filter((c) => !(c.updatedAt && !c.hasData)).length;
    topbar.innerHTML = `<a class="brand" href="#" data-home><img src="icons/mascot-160.png" alt="">어디갈래</a><span class="sub">전국 ${total}개 시·군</span>`;
  }
  function showHome(view = "home") {
    state.city = null;
    homeTopbar();
    setTabbar(view);
    if (view === "map") return showMapPage();
    if (view === "cities") return showCitiesPage();
    if (view === "about") return showAboutPage();
    if (view === "me") return showMePage();
    app.innerHTML = `
      <section class="hero-card">
        <h1>이번 주말,<br>어디 갈래?</h1>
        <p>어디냥이 유튜브·카카오맵·T맵 빅데이터로 요즘 뜨는 곳을 골라왔어요.</p>
        <img class="mascot" src="icons/mascot-360.png" alt="어디냥">
      </section>
      ${state.half?.regions?.some((r) => r.active) ? `<button class="half-home" data-half-go>
        <span class="half-tag">반값여행</span>
        <b>${esc(state.half.season)} ${state.half.regions.filter((r) => r.active).length}개 지역, 여행경비 절반 돌려받기</b>
        <span>${state.half.regions.filter((r) => r.active).slice(0, 6).map((r) => esc(r.name.replace(/\(.*\)/, ""))).join(" · ")} 등 →</span>
      </button>` : ""}
      <section id="weekly" class="weekly"></section>
      <div class="home-more"><button class="btn-ghost" data-view="map">핫플 지도로 보기 →</button></div>`;
    renderWeekly();
  }
  function showMapPage() {
    app.innerHTML = `
      <section class="page-head">
        <h1><img src="icons/mascot-160.png" alt="">핫플 지도</h1>
        <p>동그라미가 클수록 요즘 유튜브에 많이 나오는 도시예요. 빨간 숫자는 전국 화제 장소 순위예요. 두 손가락으로 벌리거나 +버튼을 누르면 확대돼요.</p>
      </section>
      <section class="weekly map-sec" style="margin-top:14px">
        <div class="weekly-head"><span class="wk" id="map-at"></span></div>
        <div id="hotmap" class="hotmap" role="region" aria-label="전국 핫플 지도"><p class="map-wait">지도를 불러오는 중…</p></div>
      </section>`;
    renderMap();
  }
  function showCitiesPage() {
    const provinces = ["전체", ...(state.half?.regions?.length ? ["반값여행"] : []), ...new Set(state.index.cities.map((c) => c.province))];
    app.innerHTML = `
      <section class="page-head">
        <h1><img src="icons/mascot-160.png" alt="">도시 찾기</h1>
        <p>도시를 고르면 유튜브 조회수 Top 10, 추천 코스, 이동시간, 맛집을 보여드려요.</p>
      </section>
      <section class="intro" style="padding-top:6px">
        <label class="search" for="q">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="q" type="search" placeholder="도시 이름 검색 (예: 남원, 통영)" autocomplete="off" value="${esc(state.q)}">
        </label>
        <div class="chips" role="group" aria-label="시·도">${provinces.map((p) =>
          `<button class="chip" data-prov="${esc(p)}" aria-pressed="${p === state.prov}">${esc(p)}</button>`).join("")}</div>
      </section>
      <div id="results"></div>`;
    const q = document.getElementById("q");
    q.addEventListener("input", () => { state.q = q.value.trim(); renderResults(); });
    renderResults();
  }
  function showMePage() {
    const cities = state.index.cities.filter((c) => !(c.updatedAt && !c.hasData));
    const total = cities.length;
    const n = cities.filter((c) => visited.has(c.id)).length;
    const nx = nextLevel(n);
    const byProv = new Map();
    const provOf = (c) => (c.province === c.name ? "특별·광역시" : c.province);   // 서울·부산 등은 한데 묶기
    for (const c of cities) { const k = provOf(c); if (!byProv.has(k)) byProv.set(k, []); byProv.get(k).push(c); }
    app.innerHTML = `
      <section class="page-head">
        <h1><img src="icons/mascot-160.png" alt="">내 여행</h1>
        <p>다녀온 도시를 눌러 도장을 찍어보세요. 이 휴대폰에만 저장돼요.</p>
      </section>
      <section class="stamp-hero">
        <div class="stamp-count"><b>${n}</b><span>/ ${total}곳</span></div>
        <div class="stamp-level">${esc(levelOf(n))}${nx ? `<small>${nx[0] - n}곳 더 가면 '${esc(nx[1])}'</small>` : "<small>전국을 다 다녀왔어요!</small>"}</div>
        <div class="stamp-bar"><span style="width:${(n / Math.max(total, 1) * 100).toFixed(1)}%"></span></div>
        <button class="btn-ghost stamp-share" data-share-stamps ${n ? "" : "disabled"}>내 도장판 공유하기</button>
      </section>
      ${[...byProv].map(([prov, cs]) => {
        const k = cs.filter((c) => visited.has(c.id)).length;

  // 도장판 공유 이미지 (1080×1350, 인스타 세로)
  async function shareStamps() {
    const cities = state.index.cities.filter((c) => !(c.updatedAt && !c.hasData));
    const n = cities.filter((c) => visited.has(c.id)).length;
    const W = 1080, H = 1350, cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    const g = cv.getContext("2d");
    const grad = g.createLinearGradient(0, 0, W * 0.4, H);
    grad.addColorStop(0, "#22B79A"); grad.addColorStop(0.55, "#12907A"); grad.addColorStop(1, "#0B6E61");
    g.fillStyle = grad; g.fillRect(0, 0, W, H);
    await document.fonts.load('80px "Jua"').catch(() => {});
    const font = (px) => `${px}px "Jua", "Apple SD Gothic Neo", sans-serif`;
    g.fillStyle = "#fff"; g.font = font(64); g.fillText("나의 국내여행 도장깨기", 80, 140);
    g.font = font(220); g.fillText(String(n), 80, 400);
    const w = g.measureText(String(n)).width;
    g.font = font(72); g.globalAlpha = .85; g.fillText(`/ ${cities.length}곳`, 100 + w, 400); g.globalAlpha = 1;
    g.font = font(60); g.fillStyle = "#FFF3DC"; g.fillText(levelOf(n), 80, 500);
    // 시·도별 막대
    const byProv = new Map();
    for (const c of cities) {
      const key = c.province === c.name ? "특별·광역시" : c.province;
      const v = byProv.get(key) || [0, 0]; v[1]++; if (visited.has(c.id)) v[0]++; byProv.set(key, v);
    }
    const rows = [...byProv].sort((a, b) => b[1][0] / b[1][1] - a[1][0] / a[1][1]).slice(0, 9);
    let y = 600;
    g.font = font(38);
    for (const [prov, [k, t]] of rows) {
      g.fillStyle = "#fff"; g.fillText(prov.replace(/특별자치도|특별자치시|광역시|특별시/, ""), 80, y + 34);
      g.fillStyle = "rgba(255,255,255,.22)"; g.beginPath(); g.roundRect(330, y + 6, 560, 34, 17); g.fill();
      if (k) { g.fillStyle = "#FFF3DC"; g.beginPath(); g.roundRect(330, y + 6, Math.max(34, 560 * k / t), 34, 17); g.fill(); }
      g.fillStyle = "#fff"; g.fillText(`${k}/${t}`, 915, y + 34);
      y += 64;
    }
    const img = new Image(); img.src = "icons/mascot-360.png";
    await img.decode().catch(() => {});
    if (img.naturalWidth) g.drawImage(img, W - 380, 210, 300, 300 * img.naturalHeight / img.naturalWidth);
    g.fillStyle = "#fff"; g.font = font(44); g.fillText("어디갈래", 80, H - 90);
    g.globalAlpha = .8; g.font = font(30); g.fillText("lloydknam.github.io/eodigallae", 80, H - 45); g.globalAlpha = 1;
    const blob = await new Promise((ok) => cv.toBlob(ok, "image/png"));
    const file = new File([blob], "eodigallae-stamps.png", { type: "image/png" });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: "나의 도장깨기", text: `국내여행 도장깨기 ${n}/${cities.length}곳 — 어디갈래` });
        return;
      }
    } catch (e) { if (e && e.name === "AbortError") return; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "eodigallae-stamps.png";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  // ── 전국 핫플 지도 (Leaflet + OpenStreetMap/CARTO 바탕지도) ──
  let mapData = null, leafletReady = null;
  function loadLeaflet() {
    if (window.L) return Promise.resolve();
    if (leafletReady) return leafletReady;
    leafletReady = new Promise((ok, fail) => {
      const css = document.createElement("link");
      css.rel = "stylesheet"; css.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";
      document.head.appendChild(css);
      const js = document.createElement("script");
      js.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
      js.onload = ok; js.onerror = fail;
      document.head.appendChild(js);
    });
    return leafletReady;
  }
  async function renderMap() {
    const box = document.getElementById("hotmap");
    if (!box) return;
    try {
      if (!mapData) {
        const r = await fetch("data/map.json", { cache: "no-cache" });
        mapData = r.ok ? await r.json() : null;
      }
      if (!mapData || !mapData.cities.length) { box.closest(".map-sec").hidden = true; return; }
      await loadLeaflet();
    } catch {
      box.innerHTML = `<p class="map-wait">지도를 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.</p>`;
      return;
    }
    if (!document.body.contains(box)) return;
    document.getElementById("map-at").textContent = (mapData.updatedAt || "").slice(5, 10).replace("-", ".") + " 업데이트";
    box.innerHTML = "";
    const dark = matchMedia("(prefers-color-scheme: dark)").matches && document.documentElement.dataset.theme !== "light"
      || document.documentElement.dataset.theme === "dark";
    // 휴대폰: 한 손가락은 화면 스크롤로 넘기고, 지도는 두 손가락(확대·축소)이나 +/− 버튼으로만 움직인다
    const touch = matchMedia("(pointer: coarse)").matches;
    const map = L.map(box, { zoomControl: true, scrollWheelZoom: false, attributionControl: true, minZoom: 6, maxZoom: 15,
      dragging: !touch, tap: !touch })
      .fitBounds([[33.1, 125.0], [38.6, 130.0]]);
    // 바탕지도: 오픈스트리트맵 공식 타일 (키 불필요, 출처 표시 필수). 어두운 모드는 색을 뒤집어 맞춘다.
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 기여자',
    }).addTo(map);
    box.classList.toggle("dark-tiles", dark);
    const maxV = Math.max(...mapData.cities.map((c) => c.views || 0), 1);
    const css = getComputedStyle(document.documentElement);
    const teal = css.getPropertyValue("--celadon").trim() || "#12907A";
    for (const c of mapData.cities) {
      const r = 10 + 30 * Math.sqrt((c.views || 0) / maxV);
      L.circleMarker([c.lat, c.lng], { radius: r, color: teal, weight: 2, fillColor: teal, fillOpacity: 0.28 })
        .addTo(map)
        .bindPopup(`<div class="mpop"><b>${esc(c.name)}</b><span>최근 6개월 영상 조회 ${fmtViews(c.views || 0)}회</span>
          ${c.top.length ? `<span>요즘 뜨는 곳: ${c.top.map(esc).join(", ")}</span>` : ""}
          <a href="#${enc(c.id)}" data-city="${esc(c.id)}">도시 보기 →</a></div>`);
    }
    const pins = mapData.spots.map((s, i) => {
      const icon = L.divIcon({ className: "", iconSize: [30, 30], iconAnchor: [15, 15],
        html: `<span class="mpin${i < 3 ? " top" : ""}">${i + 1}</span>` });
      return L.marker([s.lat, s.lng], { icon, zIndexOffset: 1000 - i, title: s.name })
        .bindPopup(`<div class="mpop">
          ${s.thumb ? `<img src="${esc(s.thumb)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}
          <b>${i + 1}. ${esc(s.name)}</b><span>${esc(s.city)} · 조회 ${fmtViews(s.views)}회 · 영상 ${s.n}편</span>
          ${s.week ? `<span class="mweek">이번 주 유튜브 ${s.week}위</span>` : ""}
          <span class="mlinks">${s.video ? `<a href="${ytWatch(s.video)}" target="_blank" rel="noopener">영상 보기 ↗</a>` : ""}
          <a href="#${enc(s.cityId)}" data-city="${esc(s.cityId)}">도시 보기 →</a></span></div>`, { maxWidth: 240 });
    });
    const layer = L.layerGroup().addTo(map);
    const sync = () => {   // 멀리서는 상위 15곳만, 확대하면 60곳 전부
      layer.clearLayers();
      const n = map.getZoom() >= 9 ? pins.length : 15;
      pins.slice(0, n).forEach((m) => layer.addLayer(m));
    };
    map.on("zoomend", sync);
    sync();
  }

        ${halfBanner(d.id)}
        <span class="meta">관광지 ${d.spots.length}곳${hotCount ? ` · 요즘 뜨는 곳 ${hotCount}곳` : ""} · 추천 코스 ${d.courses.length}개${vidCount ? ` · 영상 ${vidCount}편` : ""} · ${esc((d.updatedAt || "").slice(0, 10))} 기준</span>
        ${d.sample ? `<div class="notice">샘플 데이터예요. 좌표는 근사치이고, 사진·영상·식당은 API를 연결하면 자동으로 채워져요. 지금은 사진을 누르면 유튜브 검색으로 연결돼요.</div>` : ""}
      </section>
      ${cityTop10(d)}
      <div class="tabs" role="tablist" id="tabs">
        ${tabBtn("course", "추천 코스", d.courses.length)}
        ${tabBtn("spots", "관광지", d.spots.length)}
        ${tabBtn("food", "맛집", d.restaurants.length || null)}
      </div>
      <section class="panel" id="panel" role="tabpanel"></section>
      <p class="credit">${esc(d.credit || "관광정보: 한국관광공사 TourAPI · 영상: YouTube")} · 이동시간은 직선거리 기반 추정치예요. 정확한 경로는 카카오맵 길찾기로 확인하세요.</p>`;
    renderPanel();
  }
  // 도시별 유튜브 조회수 Top 10 (최근 6개월 영상 중 그 장소가 나온 영상들의 조회수 합)
  function cityTop10(d) {
    const top = d.spots.filter((s) => s.yt && s.yt.views > 0).sort((a, b) => b.yt.views - a.yt.views).slice(0, 10);
    if (top.length < 3) return "";
    const at = (d.ytAt || d.updatedAt || "").slice(0, 10).replace(/-/g, ".");
    return `<section class="weekly city-top">
      <div class="weekly-head">
        <h2><img src="icons/mascot-160.png" alt="">유튜브 조회수 Top 10</h2>
        <span class="wk">${esc(at)} 기준</span>
      </div>
      <p class="weekly-desc">최근 6개월 ${esc(baseCity(d.name))} 여행 영상에 나온 장소를, 그 영상들의 조회수 합으로 줄 세웠어요.</p>
      <ol class="rank-grid">${top.map((s, i) => {
        const v = (s.videos || [])[0];
        const thumb = (v && v.thumb) || s.image || s.thumb;
        return `<li class="rank-card">
          <a class="rthumb" href="${v ? ytWatch(v.id) : ytSearch(d.name, s.name)}" target="_blank" rel="noopener" aria-label="${esc(s.name)} 영상 보기" style="${artBg(s.name)}">
            <img class="rglyph" src="icons/mascot-160.png" alt="">
            ${thumb ? `<img src="${esc(thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}
            <span class="no">${i + 1}</span>
            <span class="rplay">${playIcon}</span>
          </a>
          <button class="rbody" data-spot="${esc(s.id)}">
            <span class="rname">${esc(s.name)}</span>
            <span class="rmeta">${s.cat ? esc(s.cat) : (s.rank ? `인기 ${s.rank}위` : "관광지")}</span>
            <span class="rstat">조회 ${fmtViews(s.yt.views)}회 · 영상 ${s.yt.n}편</span>
          </button>
        </li>`;
      }).join("")}</ol>
    </section>`;
  }

  const tabBtn = (id, label, n) =>
    `<button class="tab" role="tab" data-tab="${id}" aria-selected="${state.tab === id}">${label}${n ? `<small>${n}</small>` : ""}</button>`;

  function renderPanel() {
    const p = document.getElementById("panel");
    if (state.tab === "course") p.innerHTML = coursePanel();
    else if (state.tab === "spots") p.innerHTML = spotsPanel();
    else p.innerHTML = foodPanel();
  }

  // 코스 패널: 노선도 + 동선 스케치
  function coursePanel() {
    const d = state.city;
    if (!d.courses.length) return `<div class="empty-card"><h4>아직 추천 코스가 없어요</h4><p>관광지 탭에서 가고 싶은 곳을 먼저 둘러보세요.</p></div>`;
    const c = d.courses[Math.min(state.course, d.courses.length - 1)];
    const day = c.days[Math.min(state.day, c.days.length - 1)];
    const stops = resolveStops(day.stops);
    return `
      <div class="course-pick" role="group" aria-label="코스">${d.courses.map((x, i) =>
        `<button class="chip" data-course="${i}" aria-pressed="${i === state.course}">${esc(x.title)}</button>`).join("")}</div>
      ${c.summary ? `<p class="course-summary">${esc(c.summary)}</p>` : ""}
      ${c.days.length > 1 ? `<div class="days" role="group" aria-label="일차">${c.days.map((x, i) =>
        `<button data-day="${i}" aria-pressed="${i === state.day}">${esc(x.label)}</button>`).join("")}</div>` : ""}
      <div class="course-grid">
        <ol class="line">${lineHTML(stops)}</ol>
        ${sketchHTML(stops)}
      </div>`;
  }

  function resolveStops(raw) {
    const d = state.city;
    const out = [];
    for (const s of raw) {
      if (s.kind === "spot") {
        const spot = d.spotMap.get(s.id);
        if (spot) out.push({ kind: "spot", spot, note: s.note, place: spot });
      } else if (s.kind === "meal") {
        const food = s.id ? d.foodMap.get(s.id) : null;
        const near = d.spotMap.get(s.near) || (food ? null : out.at(-1)?.place);
        const place = food || near;
        if (place) out.push({ kind: "meal", food, near, note: s.note, place });
      }
    }
    return out;
  }

  function lineHTML(stops) {
    let n = 0, html = "";
    const total = { min: 0, km: 0 };
    stops.forEach((s, i) => {
      if (i > 0) {
        const prev = stops[i - 1].place;
        if (prev !== s.place && km(prev, s.place) > 0.05) {
          const e = estimate(prev, s.place);
          total.min += e.min; total.km += e.km;
          html += `<li class="leg" aria-label="이동"><span class="rail"></span>
            <div class="info"><b>${e.mode}</b> 약 ${fmtMin(e.min)} · ${fmtKm(e.km)}
              <a href="${kakaoRoute(prev, s.place)}" target="_blank" rel="noopener">길찾기 ↗</a></div></li>`;
        }
      }
      if (s.kind === "spot") {
        n++;
        const sp = s.spot;
        const video = sp.videos?.[0];
        html += `<li class="stop"><span class="rail"><span class="dot">${n}</span></span>
          <div class="content">
            ${s.note ? `<span class="note">${esc(s.note)}</span>` : ""}
            <h4>${esc(sp.name)}${sp.hot ? `<span class="rank hot">요즘 뜨는 ${sp.hot}위</span>` : ""}${sp.rank ? `<span class="rank">인기 ${sp.rank}위</span>` : ""}</h4>
            ${sp.desc ? `<p class="desc">${esc(sp.desc)}</p>` : ""}
            <div class="links">
              <a href="${video ? ytWatch(video.id) : ytSearch(state.city.name, sp.name)}" target="_blank" rel="noopener">${video ? "영상 보기" : "영상 찾기"} ↗</a>
              <a href="${kakaoPin(sp)}" target="_blank" rel="noopener">지도 ↗</a>
            </div>
          </div></li>`;
      } else {
        const titleHTML = s.food
          ? esc(s.food.name) + (s.food.rank ? `<span class="rank">인기 ${s.food.rank}위</span>` : "")
          : `${esc(s.near.name)} 주변 식당`;
        const link = s.food ? kakaoPin(s.food) : kakaoSearch(`${baseCity(state.city.name)} ${s.near.name} 맛집`);
        html += `<li class="stop meal"><span class="rail"><span class="dot"></span></span>
          <div class="content">
            ${s.note ? `<span class="note">${esc(s.note)}</span>` : ""}
            <h4>${titleHTML}</h4>
            <div class="links"><a href="${link}" target="_blank" rel="noopener">${s.food ? "지도" : "식당 찾아보기"} ↗</a></div>
          </div></li>`;
      }
    });
    if (total.min) html += `<li class="estimate-note" style="list-style:none;padding-left:46px">이동만 약 ${fmtMin(total.min)} · ${fmtKm(total.km)}</li>`;
    return html;
  }

  // 동선 스케치: 위경도를 화면 좌표로 바로 투영한 SVG (지도 타일 없이 동선의 모양만)
  function sketchHTML(stops) {
    const pts = []; const seen = new Set();
    let n = 0;
    for (const s of stops) {
      if (s.kind === "spot") { n++; if (!seen.has(s.spot.id)) { seen.add(s.spot.id); pts.push({ ...s.spot, n }); } }
    }
    if (pts.length < 2) return "";
    const W = 240, H = 200, pad = 22;
    const lat0 = pts.reduce((a, p) => a + p.lat, 0) / pts.length;
    const k = Math.cos(lat0 * Math.PI / 180);
    const xs = pts.map((p) => p.lng * k), ys = pts.map((p) => p.lat);
    const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
    const span = Math.max(maxX - minX, maxY - minY, 0.002);
    const sc = Math.min((W - pad * 2) / Math.max(maxX - minX, span * 0.35), (H - pad * 2) / Math.max(maxY - minY, span * 0.35));
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    const P = pts.map((p) => ({ x: W / 2 + (p.lng * k - cx) * sc, y: H / 2 - (p.lat - cy) * sc, n: p.n, name: p.name }));
    const spanKm = km({ lat: minY, lng: minX / k }, { lat: maxY, lng: maxX / k });
    const grid = [];
    for (let gx = 20; gx < W; gx += 20) grid.push(`<line x1="${gx}" y1="0" x2="${gx}" y2="${H}"/>`);
    for (let gy = 20; gy < H; gy += 20) grid.push(`<line x1="0" y1="${gy}" x2="${W}" y2="${gy}"/>`);
    const first = pts[0], last = pts[pts.length - 1];
    return `<figure class="sketch" style="margin:0">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="코스 동선 스케치">
        <g stroke="var(--line)" stroke-width="1" fill="none">${grid.join("")}</g>
        <polyline points="${P.map((p) => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ")}" fill="none" stroke="var(--celadon)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
        ${P.map((p) => `<g><circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="9" fill="var(--surface)" stroke="var(--celadon)" stroke-width="3"/>
          <text x="${p.x.toFixed(1)}" y="${(p.y + 3.6).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ink)" font-family="IBM Plex Sans KR, sans-serif">${p.n}</text></g>`).join("")}
        <text x="${W - 6}" y="14" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Sans KR, sans-serif">N ↑</text>
      </svg>
      <figcaption class="cap"><span>동선 범위 약 ${fmtKm(spanKm)}</span>
        <a href="${kakaoRoute(first, last)}" target="_blank" rel="noopener">카카오맵으로 보기 ↗</a></figcaption>
    </figure>`;
  }

  // 관광지 패널: 사진을 누르면 영상으로
  function spotsPanel() {
    const d = state.city;
    const hasHot = d.spots.some((s) => s.hot);
    const sort = hasHot ? state.sort : "rank";
    const list = [...d.spots].sort(sort === "hot"
      ? (a, b) => (a.hot || 999) - (b.hot || 999) || (a.rank || 999) - (b.rank || 999)
      : (a, b) => (a.rank || 999) - (b.rank || 999) || (a.hot || 999) - (b.hot || 999));
    const toggle = hasHot ? `<div class="course-pick" role="group" aria-label="정렬" style="margin-bottom:14px">
        <button class="chip" data-sort="hot" aria-pressed="${sort === "hot"}">요즘 뜨는 순</button>
        <button class="chip" data-sort="rank" aria-pressed="${sort === "rank"}">대표 명소 순</button></div>
      ${sort === "hot" ? `<p class="course-summary" style="margin:-4px 0 14px">최근 6개월 유튜브 여행 영상에 많이 나오고 많이 본 곳 순서예요.</p>` : ""}` : "";
    return `${toggle}<div class="spots">${list.map((s) => {
      const v = s.videos || [];
      const href = v[0] ? ytWatch(v[0].id) : ytSearch(d.name, s.name);
      const foods = (s.foods || []).map((id) => d.foodMap.get(id)).filter(Boolean);
      const badges = [
        s.hot && sort === "hot" ? `<span class="rank hot">요즘 뜨는 ${s.hot}위</span>` : "",
        s.rank && sort === "rank" ? `<span class="rank">인기 ${s.rank}위</span>` : "",
        s.hot && sort === "rank" ? `<span class="rank hot">요즘 뜨는 ${s.hot}위</span>` : "",
        s.rank && sort === "hot" ? `<span class="rank">인기 ${s.rank}위</span>` : "",
      ].join("");
      return `<article class="spot" id="spot-${esc(s.id)}">
        <a class="photo" href="${href}" target="_blank" rel="noopener" aria-label="${esc(s.name)} 영상 보기">
          ${art(s.id, s.name, s.image)}
          <span class="play">${playIcon}${v.length ? `영상 ${s.yt ? s.yt.n : v.length}편` : "영상 찾기"}</span>
        </a>
        <div class="body">
          <h4>${esc(s.name)}${badges}</h4>
          ${s.cat ? `<span class="addr">${esc(s.cat)} · 카카오맵 장소</span>` : ""}
          ${s.addr ? `<span class="addr">${esc(s.addr)}</span>` : ""}
          ${s.yt ? `<span class="buzz">최근 영상 ${s.yt.n}편 · 조회 ${fmtViews(s.yt.views)}회</span>` : ""}
          ${s.desc ? `<p class="desc">${esc(s.desc)}</p>` : ""}
          ${v.length > 1 ? `<ul class="vids">${v.slice(1, 4).map((x) => `<li><a href="${ytWatch(x.id)}" target="_blank" rel="noopener">
              <span class="th">${x.thumb ? `<img src="${esc(x.thumb)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</span>
              <span><span class="t">${esc(x.title)}</span><span class="c">${esc(x.channel)} · ${esc(x.published)}${x.views ? ` · 조회 ${fmtViews(x.views)}` : ""}</span></span></a></li>`).join("")}</ul>` : ""}
          ${foods.length ? `<span class="addr">근처 식당: ${foods.map((f) => esc(f.name)).join(", ")}</span>` : ""}
          <div class="links">
            <a href="${igTag(s.name)}" target="_blank" rel="noopener">인스타그램 #${esc(s.name.replace(/\s+/g, ""))} ↗</a>
            <a href="${kakaoPin(s)}" target="_blank" rel="noopener">${s.kakao ? "카카오맵·리뷰" : "지도"} ↗</a>
          </div>
        </div>
      </article>`;
    }).join("")}</div>`;
  }

  // 맛집 패널
  function foodPanel() {
    const d = state.city;
    const city = baseCity(d.name);
    const spec = (d.specialties || []).length ? `<div class="specialties">${d.specialties.map((x) =>
      `<a href="${kakaoSearch(`${city} ${x}`)}" target="_blank" rel="noopener">${esc(x)}</a>`).join("")}</div>` : "";
    if (!d.restaurants.length) {
      return `<div class="empty-card">
        <h4>${esc(city)}에서 먹어볼 것</h4>
        ${spec}
        <p>관광공사에 등록된 음식점은 API를 연결하면 관광지별로 묶여서 보여요. 지금은 메뉴를 누르면 카카오맵 검색으로 연결돼요.</p>
        <a class="btn-link" href="${kakaoSearch(`${city} 맛집`)}" target="_blank" rel="noopener">카카오맵에서 ${esc(city)} 맛집 보기 ↗</a>
      </div>`;
    }
    const nearOf = new Map();
    for (const s of d.spots) for (const id of s.foods || []) { if (!nearOf.has(id)) nearOf.set(id, s.name); }
    return `${spec ? `<div style="margin-bottom:14px">${spec}</div>` : ""}<div class="foods">${d.restaurants.map((f) => `
      <article class="food">
        <h4>${esc(f.name)}${f.rank ? `<span class="rank">인기 ${f.rank}위</span>` : ""}</h4>
        ${nearOf.has(f.id) ? `<span class="near">${esc(nearOf.get(f.id))} 근처</span>` : ""}
        ${f.addr ? `<span class="addr">${esc(f.addr)}</span>` : ""}
        <div class="links"><a href="${kakaoPin(f)}" target="_blank" rel="noopener">지도·리뷰 ↗</a>${f.tel ? `<span class="addr">${esc(f.tel)}</span>` : ""}</div>
      </article>`).join("")}</div>`;
  }

  // ── 이벤트 위임 ──
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-city],[data-home],[data-prov],[data-tab],[data-course],[data-day],[data-sort],[data-list],[data-spot],[data-view],[data-stamp],[data-share-stamps],[data-half-go]");
    if (!t) return;
    if (t.dataset.stamp) {
      const id = t.dataset.stamp;
      if (visited.has(id)) visited.delete(id); else visited.add(id);
      saveVisited();
      if (location.hash === "#me") showMePage();
      else t.outerHTML = stampBtn(id);
      return;
    }
    if ("shareStamps" in t.dataset) { shareStamps(); return; }
    if ("halfGo" in t.dataset) { state.prov = "반값여행"; state.q = ""; go("cities"); return; }
    if (t.dataset.view) { e.preventDefault(); go(t.dataset.view === "home" ? null : t.dataset.view); }
    else if (t.dataset.city) { e.preventDefault(); go(t.dataset.city); }
    else if ("home" in t.dataset) { e.preventDefault(); go(null); }
    else if (t.dataset.prov) {
      state.prov = t.dataset.prov;
      document.querySelectorAll("[data-prov]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.prov === state.prov));
      renderResults();
    } else if (t.dataset.tab) {
      state.tab = t.dataset.tab; store.set("tab", state.tab);
      document.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === state.tab));
      renderPanel();
    } else if (t.dataset.course) { state.course = +t.dataset.course; state.day = 0; renderPanel(); }
    else if (t.dataset.day) { state.day = +t.dataset.day; renderPanel(); }
    else if (t.dataset.list) { state.list = t.dataset.list; renderWeekly(); }
    else if (t.dataset.spot) {
      state.tab = "spots";
      document.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === "spots"));
      renderPanel();
      const el = document.getElementById("spot-" + t.dataset.spot);
      if (el) {
        el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
        el.classList.add("flash");
        setTimeout(() => el.classList.remove("flash"), 1600);
      }
    }
    else if (t.dataset.sort) { state.sort = t.dataset.sort; store.set("sort", state.sort); renderPanel(); }
  });

  // ── 시작 ──
  loadIndex().then(route).catch((err) => {
    app.innerHTML = `<p class="empty-note">${esc(err.message)} 잠시 후 다시 열어 주세요.</p>`;
  });

  // 오프라인 캐시 (GitHub Pages 등 https 배포에서만)
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    try {
      const hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" })
        .then((reg) => reg.update()).catch(() => {});
      // 새 버전이 설치되면 한 번만 새로고침해서 바로 보여준다
      let reloaded = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (hadController && !reloaded) { reloaded = true; location.reload(); }
      });
    } catch { /* 미지원 환경 */ }
  }
})();
</script>
</body>
</html>
