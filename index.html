<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>어디갈래</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="전국 시·군별 관광지, 추천 코스, 이동시간, 주변 맛집과 최신 여행 영상을 한곳에서.">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-48.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 한 손으로 쓰는 세로 앱. 마스코트 '어디냥'(위치 핀을 꽂은 크림색 고양이)이 브랜드.
   색은 아이콘에서: 청록 바탕, 크림 얼굴, 핀 코럴, 볼터치 핑크. 둥글고 말랑한 카드. */
:root {
  --paper: #F2F4F6;
  --surface: #FFFFFF;
  --ink: #191F28;
  --muted: #6B7684;
  --line: #E5E8EB;
  --celadon: #12907A;
  --celadon-deep: #0B6E61;
  --celadon-ink: #FFFFFF;
  --celadon-soft: #DFF2EB;
  --cream: #FFF3DC;
  --vermilion: #E4503A;
  --blush: #F7A39A;
  --ochre: #B7791F;
  --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --radius: 22px;
  --shadow: 0 1px 3px rgba(25, 31, 40, .04);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font: 16px/1.6 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--celadon); outline-offset: 2px; border-radius: 6px; }
img { max-width: 100%; }
[hidden] { display: none !important; }

.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(10px, env(safe-area-inset-left, 0px));
  padding-right: max(10px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface);
}
.topbar .inner {
  max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 12px; min-height: 54px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.brand { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 26px; text-decoration: none; color: var(--celadon); }
.brand img { width: 36px; height: auto; display: block; }
.brand img.clerk { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid var(--celadon-soft); box-shadow: 0 1px 4px rgba(25,31,40,.15); }
.topbar .sub { color: var(--muted); font-size: 14px; margin-left: auto; white-space: nowrap; }
.topbar .inner { position: relative; }
.tb-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; }
.menu-btn { flex: none; width: 40px; height: 40px; margin-right: -6px; border: 0; border-radius: 12px; background: none; color: var(--ink); display: grid; place-items: center; cursor: pointer; }
.menu-btn svg { width: 24px; height: 24px; }
.menu-btn[aria-expanded="true"] { background: var(--paper); }
.menu-drop { position: absolute; right: 8px; top: calc(100% - 4px); z-index: 40; min-width: 230px; padding: 6px; background: var(--surface); border-radius: 16px;
  box-shadow: 0 10px 30px rgba(25,31,40,.16), 0 1px 3px rgba(25,31,40,.08); display: grid; }
.menu-drop a { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 10px; text-decoration: none; color: var(--ink); font-size: 15.5px; font-weight: 600; }
.menu-drop a:hover, .menu-drop a:focus-visible { background: var(--paper); }
.menu-drop a[aria-current="page"] { color: var(--celadon); background: var(--celadon-soft); }
.menu-drop span { width: 22px; text-align: center; }
.menu-drop em { margin-left: auto; font-style: normal; font-weight: 500; font-size: 12px; color: var(--muted); }
.menu-drop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
.back { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 12px 4px; cursor: pointer; color: var(--ink); font-size: 16px; font-weight: 600; }
.back:hover { color: var(--ink); }

/* ── 홈 ── */
.intro { padding-block: 28px 8px; }
.hero-card {
  position: relative; margin-top: 10px; padding: 20px 18px 22px; padding-right: 140px; border-radius: 22px; overflow: hidden;
  background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
}
.hero-card::before { content: ""; position: absolute; right: -40px; bottom: -60px; width: 220px; height: 220px; border-radius: 50%; background: var(--celadon-soft); pointer-events: none; }
.hero-card h1 em { font-style: normal; color: var(--celadon); }
.hero-card h1 { position: relative; font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 8.4vw, 40px); line-height: 1.2; margin: 0 0 8px; text-wrap: balance; }
.hero-card p { position: relative; margin: 0; font-size: 15px; line-height: 1.55; color: var(--muted); }
.hero-card .mascot { position: absolute; right: 6px; bottom: -12px; width: 126px; height: auto; filter: drop-shadow(0 6px 10px rgba(25,31,40,.12)); transform-origin: 50% 90%; }
@media (prefers-reduced-motion: no-preference) {
  .hero-card .mascot { animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: rotate(-3deg) translateY(0); } 50% { transform: rotate(3deg) translateY(-4px); } }
}
.intro h1 { font-family: var(--font-display); font-size: clamp(30px, 8vw, 38px); line-height: 1.3; margin: 0 0 6px; text-wrap: balance; font-weight: 400; }
.intro p { margin: 0; color: var(--muted); }
.search { position: relative; margin-top: 18px; }
.search input {
  width: 100%; font: inherit; font-size: 17px; padding: 15px 14px 15px 44px;
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink);
}
.search input:focus { outline: none; border-color: var(--celadon); box-shadow: 0 0 0 3px var(--celadon-soft); }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 14px 0 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 999px;
  font-size: 15px; font-weight: 500; cursor: pointer; white-space: nowrap; min-height: 42px;
}
.chip[aria-pressed="true"] { background: var(--celadon); color: var(--celadon-ink); border-color: var(--celadon); font-weight: 700; }
.section-label { font-size: 14px; letter-spacing: 0.06em; color: var(--muted); margin: 26px 0 10px; font-weight: 600; }
.ready { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.city-card {
  display: flex; flex-direction: column; text-align: left; border: 0; padding: 0; cursor: pointer;
  background: var(--surface); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
}
.city-card:hover .art { filter: saturate(1.15); }
.city-card .body { padding: 10px 12px 12px; display: grid; gap: 2px; }
.city-card .name { font-family: var(--font-display); font-weight: 400; font-size: 22px; }
.city-card .meta { color: var(--muted); font-size: 13.5px; }
.art {
  position: relative; aspect-ratio: 4 / 3; width: 100%; max-width: 100%; overflow: hidden;
  display: grid; place-items: center; color: rgba(255,255,255,.92);
  font-family: var(--font-display); font-weight: 400;
}
.art img:not(.glyph) { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.art .glyph, .rthumb .rglyph { width: 34%; max-width: 110px; opacity: .9; filter: drop-shadow(0 4px 10px rgba(0,0,0,.15)); }
.badge { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .02em; padding: 2px 7px; border-radius: 6px; background: var(--celadon-soft); color: var(--celadon); }
.rank { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: color-mix(in srgb, var(--vermilion) 12%, transparent); color: var(--vermilion); font-variant-numeric: tabular-nums; vertical-align: 2px; margin-left: 6px; }
.rank.hot { background: color-mix(in srgb, var(--ochre) 16%, transparent); color: var(--ochre); }
.buzz { font-size: 12.5px; color: var(--ochre); font-weight: 600; font-variant-numeric: tabular-nums; }
.badge.warn { background: color-mix(in srgb, var(--ochre) 16%, transparent); color: var(--ochre); }

.weekly { margin-top: 16px; }
.weekly-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.weekly-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 28px; margin: 0; display: flex; align-items: center; gap: 6px; }
.weekly-head h2 img { width: 38px; height: auto; }
.weekly-head h2 { gap: 10px !important; }
.weekly-head .wk { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.weekly .chips { padding-top: 10px; }
.weekly-desc { font-size: 14.5px; color: var(--muted); margin: 6px 0 10px; }
.rank-grid { list-style: none; margin: 4px 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 8px; }
.rank-card { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.rthumb { position: relative; display: grid; place-items: center; aspect-ratio: 4 / 5; max-width: 100%; border-radius: 6px; box-shadow: var(--shadow); overflow: hidden; text-decoration: none; }
.rthumb img:not(.rglyph) { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

.rthumb::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.35) 0%, transparent 35%, transparent 70%, rgba(0,0,0,.35) 100%); pointer-events: none; }
.rthumb .no { position: absolute; left: 12px; top: 6px; z-index: 1; font-family: var(--font-display); font-weight: 400; font-size: 38px; line-height: 1.2; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.45); font-variant-numeric: tabular-nums; }
.rthumb .chg { position: absolute; right: 8px; top: 10px; z-index: 1; margin: 0; padding: 2px 7px; border-radius: 999px; background: rgba(255,255,255,.92); }
.rplay { position: absolute; right: 8px; bottom: 8px; z-index: 1; width: 30px; height: 30px; border-radius: 50%; background: rgba(10,16,15,.7); color: #fff; display: grid; place-items: center; }
.rplay svg { width: 13px; height: 13px; }
.rbody { display: grid; gap: 2px; text-decoration: none; min-width: 0; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; }
.city-top { margin: 18px 0 8px; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(6, 1fr);
  background: var(--surface);
  border-top: 1px solid var(--line); box-shadow: 0 -2px 10px rgba(11, 110, 97, .06);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px));
}
.tabbar button { border: 0; background: none; padding: 5px 0 4px; display: grid; justify-items: center; gap: 0; cursor: pointer; color: var(--muted); font-size: 11px; font-weight: 600; line-height: 1.3; min-height: 46px; }
.tabbar svg { width: 21px; height: 21px; }
.tabbar button[aria-current="page"] { color: var(--celadon); }
#app.wrap { padding-bottom: 8px !important; }
.site-foot.wrap { padding-top: 0; padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)) !important; }
.page-head { padding-block: 14px 2px; }
.page-head h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 8vw, 38px); margin: 0 0 6px; display: flex; align-items: center; gap: 8px; }
.page-head h1 img { width: 52px; height: auto; }
.page-head h1 { gap: 12px !important; }
.page-head p { margin: 0; color: var(--muted); }
.about { display: grid; gap: 14px; margin-top: 16px; }
.about-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; }
.about-card h3 { margin: 0 0 6px; font-size: 17px; }
.about-card p, .about-card li { margin: 0; color: var(--muted); font-size: 15px; }
.about-card ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.about-card a { color: var(--celadon); font-weight: 600; text-decoration: none; }
.stamp-btn { display: inline-flex; align-items: center; gap: 6px; margin: 8px 0 4px; padding: 7px 14px 7px 8px; border-radius: 999px;
  border: 2px dashed var(--celadon); background: transparent; color: var(--celadon); font-weight: 700; font-size: 15px; cursor: pointer; width: fit-content; }
.stamp-btn img { width: 26px; height: auto; filter: grayscale(1) opacity(.55); }
.stamp-btn.on { border-style: solid; background: var(--celadon); color: var(--celadon-ink); }
.stamp-btn.on img { filter: none; }
.stamp-hero { margin-top: 14px; padding: 20px; border-radius: 24px; color: #fff; display: grid; gap: 8px;
  background: linear-gradient(160deg, #22B79A 0%, #12907A 55%, #0B6E61 100%); box-shadow: var(--shadow); }
.stamp-count { display: flex; align-items: baseline; gap: 8px; font-family: var(--font-display); }
.stamp-count b { font-weight: 400; font-size: 64px; line-height: 1; }
.stamp-count span { font-size: 22px; opacity: .85; }
.stamp-level { font-family: var(--font-display); font-size: 24px; color: #FFF3DC; display: grid; }
.stamp-level small { font-family: var(--font-body); font-size: 14px; color: #fff; opacity: .85; }
.stamp-bar { height: 12px; border-radius: 999px; background: rgba(255,255,255,.25); overflow: hidden; }
.stamp-bar span { display: block; height: 100%; background: #FFF3DC; border-radius: 999px; }
.stamp-share { justify-self: start; margin-top: 6px; }
.stamp-share:disabled { opacity: .6; cursor: default; }
.stamp-prov { margin-top: 20px; }
.stamp-prov h3 { margin: 0 0 10px; font-size: 17px; display: flex; gap: 8px; align-items: baseline; }
.stamp-prov h3 small { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.wrap { overflow-x: clip; }
.stamps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.stamp { aspect-ratio: 1 / 1; max-width: 100%; border-radius: 50%; border: 2px dashed var(--line); background: var(--surface); color: var(--muted);
  display: grid; place-items: center; align-content: center; gap: 0; font-size: 13.5px; font-weight: 600; cursor: pointer; padding: 4px; line-height: 1.2; }
.stamp img { width: 46%; height: auto; }
.stamp.on { border: 3px solid var(--vermilion); color: var(--vermilion); background: color-mix(in srgb, var(--vermilion) 8%, var(--surface)); transform: rotate(-6deg); }
@media (prefers-reduced-motion: no-preference) { .stamp.on { animation: stampIn .25s ease-out; } @keyframes stampIn { from { transform: scale(1.3) rotate(-6deg); opacity: .4; } } }
.half-tag { display: inline-block; width: fit-content; padding: 3px 10px; border-radius: 999px; background: var(--vermilion); color: #fff; font-size: 13px; font-weight: 700; }
.half-tag.sm { font-size: 11px; padding: 2px 7px; margin-top: 2px; }
.half-card { margin-top: 10px; padding: 14px 16px; border-radius: 18px; display: grid; gap: 4px;
  background: color-mix(in srgb, var(--vermilion) 9%, var(--surface)); border: 1.5px solid color-mix(in srgb, var(--vermilion) 35%, transparent); }
.half-card b { font-size: 15.5px; line-height: 1.45; }
.half-card span:not(.half-tag) { color: var(--muted); font-size: 14px; }
.half-card a { color: var(--vermilion); font-weight: 700; text-decoration: none; font-size: 14.5px; }
.half-home { width: 100%; margin-top: 10px; padding: 14px; border-radius: 18px; text-align: left; cursor: pointer; display: grid; gap: 4px;
  background: var(--surface); border: 0; box-shadow: var(--shadow); color: var(--ink); }
.half-home b { font-size: 16.5px; }
.half-home span:not(.half-tag) { color: var(--muted); font-size: 14px; }
.half-dot { margin-left: 5px; font-size: 11px; font-weight: 700; color: #fff; background: var(--vermilion); border-radius: 999px; padding: 1px 6px; vertical-align: 1px; }
.heart { border: 1.5px solid var(--vermilion); color: var(--vermilion); background: transparent; border-radius: 999px; padding: 4px 12px; font-size: 14px; font-weight: 700; cursor: pointer; }
.heart.on { background: var(--vermilion); color: #fff; }
.linkbtn { border: 0; background: none; color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; padding: 4px 2px; text-decoration: underline; text-underline-offset: 3px; }
.plan-actions { display: flex; align-items: center; gap: 14px; margin: 10px 0 6px; flex-wrap: wrap; }
.plan-city { margin-top: 10px; padding: 12px 12px 2px; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }
.plan-city h3 { margin: 0 0 10px; font-size: 18px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.plan-city h3 a { color: var(--ink); text-decoration: none; font-family: var(--font-display); font-weight: 400; font-size: 22px; }
.plan-city h3 small { color: var(--muted); font-weight: 500; font-size: 14px; }
.plan-note { margin: 4px 0; font-size: 13px; color: var(--muted); }
.plan-extras { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 6px; }
.plan-extra { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 15px; }
.plan-extra a { color: var(--celadon); font-weight: 600; text-decoration: none; font-size: 14px; }
.toast { position: fixed; left: 50%; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30;
  background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; font-size: 14.5px; font-weight: 600; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.crowd { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; font-size: 13.5px; }
.cw-label { color: var(--muted); font-weight: 600; }
.cw { padding: 2px 9px; border-radius: 999px; font-weight: 700; font-size: 13px; }
.cw.busy { background: color-mix(in srgb, var(--vermilion) 15%, transparent); color: var(--vermilion); }
.cw.mid { background: color-mix(in srgb, var(--ochre) 15%, transparent); color: var(--ochre); }
.cw.calm { background: var(--celadon-soft); color: var(--celadon); }
.cw-tip { color: var(--muted); }
.tool-card { margin-top: 10px; padding: 14px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.tool-card h3 { margin: 0; font-size: 17px; }
.tool-card p { margin: 0; color: var(--muted); font-size: 14px; }
.tool-row { display: flex; gap: 8px; }
.tool-row input { flex: 1; min-width: 0; }
.field { display: grid; gap: 4px; font-size: 14px; font-weight: 600; }
.field input, .field textarea, .tool-row input { font: inherit; font-weight: 400; font-size: 16px; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.field textarea { min-height: 84px; resize: vertical; }
.btn-main { border: 0; border-radius: 12px; padding: 11px 18px; background: var(--celadon); color: #fff; font: inherit; font-size: 15.5px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.btn-main:disabled { opacity: .55; cursor: default; }
.entry-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.entry { display: grid; gap: 2px; padding: 13px 14px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); color: var(--ink); text-decoration: none; }
.entry b { font-size: 15.5px; }
.entry span { color: var(--muted); font-size: 13px; }
.vid-card { display: grid; grid-template-columns: 128px 1fr; gap: 12px; align-items: center; margin-top: 14px; padding: 10px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); color: var(--ink); text-decoration: none; }
.vid-card img { width: 128px; aspect-ratio: 16/9; object-fit: cover; border-radius: 4px; }
.vid-card b { font-size: 15px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.vid-card span { color: var(--muted); font-size: 13px; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; }
.stat-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.stat-tile { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 12px 14px; display: grid; gap: 2px; }
.stat-tile span { color: var(--muted); font-size: 13px; }
.stat-tile b { font-size: 26px; font-variant-numeric: tabular-nums; }
.stat-tile small { color: var(--muted); font-size: 12px; }

<script>
(() => {
  const app = document.getElementById("app");
  const topbar = document.getElementById("topbar");
  const state = { index: null, prov: "전체", q: "", city: null, tab: "course", course: 0, day: 0, sort: "hot", weekly: null, list: "youtube" };
  const cityCache = new Map();

  // 어디냥 + 소품 (cls: flip=좌우 반전, tilt=기울기, left=소품을 왼손에)
  const mz = (prop, cls = "") => `<span class="mz ${cls}"><img src="icons/mascot-160.png" alt=""><span class="prop" aria-hidden="true">${prop}</span></span>`;
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const enc = encodeURIComponent;
  // 반값여행(지역사랑 휴가지원) 시행 지역
  const halfOf = (id) => (state.half?.regions || []).find((r) => r.id === id && r.active);
  function halfBanner(id) {
    const h = halfOf(id);
    if (!h) return "";
    return `<div class="half-card">
      <span class="half-tag">반값여행</span>
      <b>${esc(state.half.benefit)}</b>
      <span>${esc(h.note)} · ${esc(state.half.howto)}</span>
      <a href="${esc(state.half.applyUrl)}" target="_blank" rel="noopener">신청 방법 보기 (대한민국 구석구석) ↗</a>
    </div>`;
  }
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* 저장 불가 환경 */ } },
  };
  // 내 코스: 담은 관광지 (이 휴대폰에만 저장)
  let plan = (() => { try { return JSON.parse(store.get("plan") || "[]"); } catch { return []; } })();
  const savePlan = () => store.set("plan", JSON.stringify(plan));
  const inPlan = (id) => plan.some((p) => p.id === id);
  function planItem(s, d) {
    return { id: s.id, cityId: d.id, city: d.name, name: s.name, lat: s.lat ?? null, lng: s.lng ?? null,
             kakao: s.kakao || null, thumb: (s.videos?.[0]?.thumb) || s.image || s.thumb || "" };
  }
  // 붐빔 예보: 0~100(그 관광지의 가장 붐비는 때 = 100). 40 미만 여유, 70 이상 혼잡
  const crowdLevel = (v) => (v >= 70 ? ["혼잡", "busy"] : v >= 40 ? ["보통", "mid"] : ["여유", "calm"]);
  const DOW = ["일", "월", "화", "수", "목", "금", "토"];
  const ymdDate = (ymd) => new Date(+ymd.slice(0, 4), +ymd.slice(4, 6) - 1, +ymd.slice(6, 8));
  function crowdHTML(spotId) {
    const days = state.city?.crowd?.[spotId];
    if (!days || !days.length) return "";
    const wk = days.filter(([ymd]) => [0, 6].includes(ymdDate(ymd).getDay())).slice(0, 2);
    const calm = days.slice(0, 10).reduce((a, b) => (b[1] < a[1] ? b : a));
    const chip = ([ymd, v]) => { const [t, c] = crowdLevel(v); const d = ymdDate(ymd);
      return `<span class="cw ${c}">${DOW[d.getDay()]} ${t}</span>`; };
    const cd = ymdDate(calm[0]);
    return `<div class="crowd"><span class="cw-label">이번 주말</span>${wk.map(chip).join("")}
      <span class="cw-tip">한산한 날 ${cd.getMonth() + 1}/${cd.getDate()}(${DOW[cd.getDay()]})</span></div>`;
  }
  function heartBtn(s) {
    const on = inPlan(s.id);
    return `<button class="heart${on ? " on" : ""}" data-heart="${esc(s.id)}" aria-pressed="${on}" aria-label="${esc(s.name)} ${on ? "코스에서 빼기" : "코스에 담기"}">${on ? "♥ 담음" : "♡ 담기"}</button>`;
  }
  // 동선: 모든 출발점에서 가까운 곳 순으로 이어 보고 가장 짧은 순서를 고른다
  function orderRoute(pts) {
    if (pts.length < 3) return pts.slice();
    let best = null, bestLen = Infinity;
    for (const start of pts) {
      const rest = pts.filter((p) => p !== start), route = [start];
      let len = 0;
      while (rest.length) {
        const cur = route[route.length - 1];
        let k = 0;
        for (let i = 1; i < rest.length; i++) if (km(cur, rest[i]) < km(cur, rest[k])) k = i;
        len += km(cur, rest[k]);
        route.push(rest.splice(k, 1)[0]);
      }
      if (len < bestLen) { bestLen = len; best = route; }
    }
    return best;
  }
  function planHTML(items, { shared = false } = {}) {
    if (!items.length) return `<div class="empty-card"><h4>아직 담은 곳이 없어요</h4>
      <p>도시 화면의 관광지 카드에서 <b>♡ 담기</b>를 누르면 여기에 모이고, 가까운 순서로 동선을 짜드려요.</p></div>`;
    const byCity = new Map();
    for (const p of items) { if (!byCity.has(p.cityId)) byCity.set(p.cityId, []); byCity.get(p.cityId).push(p); }
    return [...byCity].map(([cid, ps]) => {
      const geo = orderRoute(ps.filter((p) => p.lat != null));
      const rest = ps.filter((p) => p.lat == null);
      let total = 0, html = "";
      geo.forEach((p, i) => {
        if (i) {
          const e = estimate(geo[i - 1], p); total += e.min;
          html += `<li class="leg"><span class="rail"></span><div class="info"><b>${e.mode}</b> 약 ${fmtMin(e.min)} · ${fmtKm(e.km)}
            <a href="${kakaoRoute(geo[i - 1], p)}" target="_blank" rel="noopener">길찾기 ↗</a></div></li>`;
        }
        html += `<li class="stop"><span class="rail"><span class="dot">${i + 1}</span></span><div class="content">
          <h4>${esc(p.name)}</h4><div class="links">
          <a href="${kakaoPin(p)}" target="_blank" rel="noopener">지도 ↗</a>
          ${shared ? "" : `<button class="linkbtn" data-unheart="${esc(p.id)}">빼기</button>`}</div></div></li>`;
      });
      const extra = rest.map((p) => `<li class="plan-extra"><span>${esc(p.name)}</span>
        <a href="${kakaoPin(p)}" target="_blank" rel="noopener">카카오맵 ↗</a>
        ${shared ? "" : `<button class="linkbtn" data-unheart="${esc(p.id)}">빼기</button>`}</li>`).join("");
      return `<section class="plan-city">
        <h3>${state.index.cities.some((c) => c.id === cid) ? `<a href="#${enc(cid)}" data-city="${esc(cid)}">${esc(ps[0].city)}</a>` : `<a>${esc(ps[0].city || "기타 지역")}</a>`} <small>${ps.length}곳${total ? ` · 이동 약 ${fmtMin(total)}` : ""}</small></h3>
        ${geo.length ? `<ol class="line">${html}</ol>` : ""}
        ${extra ? `<p class="plan-note">위치 정보가 없어 순서에서 뺀 곳</p><ul class="plan-extras">${extra}</ul>` : ""}
      </section>`;
    }).join("");
  }
  const planToken = (items) => "plan=" + items.map((p) => `${p.cityId}.${p.id}`).join("~");
  async function sharePlan() {
    const url = location.origin + location.pathname + "#" + planToken(plan);
    try {
      if (navigator.share) { await navigator.share({ title: "어디갈래 내 코스", text: "내가 짠 여행 코스 보러 와!", url }); return; }
    } catch (e) { if (e && e.name === "AbortError") return; }
    try { await navigator.clipboard.writeText(url); toast("코스 링크를 복사했어요"); }
    catch { prompt("이 링크를 복사해서 보내세요", url); }
  }
  async function showSharedPlan(token) {
    setTabbar("me"); homeTopbar();
    app.innerHTML = `<p class="loading">${mz("💌")}친구가 보낸 코스를 펼치는 중…</p>`;
    const pairs = token.split("~").map((x) => x.split(".")).filter((x) => x.length === 2);
    const items = [];
    for (const [cid, sid] of pairs) {
      const meta = state.index.cities.find((c) => c.id === cid);
      const d = meta && meta.hasData ? await loadCity(cid) : null;
      const s = d && d.spotMap.get(sid);
      if (s) items.push(planItem(s, d));
    }
    state.sharedPlan = items;
    app.innerHTML = `<section class="page-head"><h1>${mz("💌", "flip left")}친구의 코스</h1>
      <p>${items.length}곳 · 가까운 순서로 정리했어요.</p></section>
      <div class="plan-actions"><button class="btn-ghost" data-take-plan ${items.length ? "" : "disabled"}>내 코스에 담기</button></div>
      ${planHTML(items, { shared: true })}`;
  }
  // ── 방문 통계: 가입 없는 무료 카운터(Abacus)에 하루 숫자만 올린다. 개인정보·쿠키 없음 ──
  const COUNTER = "https://abacus.jasoncameron.dev";
  const COUNTER_NS = "eodigallae.lloydknam.v2";   // 2026-10-24 페북 공개 시점부터 새로 셈
  const kstDay = (offset = 0) => new Date(Date.now() + 9 * 3600e3 - offset * 86400e3).toISOString().slice(0, 10).replace(/-/g, "");
  function countVisit() {
    if (location.hostname !== "lloydknam.github.io") return;   // 개발·테스트 화면은 세지 않음
    const d = kstDay(), hit = (k) => fetch(`${COUNTER}/hit/${COUNTER_NS}/${k}-${d}`, { keepalive: true }).catch(() => {});
    try {
      if (!sessionStorage.getItem("opened2")) { sessionStorage.setItem("opened2", "1"); hit("p"); }   // 앱 열기
      if (localStorage.getItem("seenDay2") !== d) { localStorage.setItem("seenDay2", d); hit("v"); }  // 그날 처음 온 기기
    } catch { /* 저장 불가 환경은 세지 않음 */ }
  }
  async function renderStats(host) {
    host.innerHTML = `<p class="loading">${mz("🧮")}방문 숫자를 세는 중…</p>`;
    let days = {};
    try { days = (await (await fetch("data/stats.json", { cache: "no-cache" })).json()).days || {}; } catch { /* 아직 없음 */ }
    const live = async (k) => { try { const r = await fetch(`${COUNTER}/get/${COUNTER_NS}/${k}`); return r.ok ? (await r.json()).value || 0 : 0; } catch { return 0; } };
    for (const off of [0, 1]) {   // 오늘·어제는 실시간
      const d = kstDay(off); const [v, p] = await Promise.all([live(`v-${d}`), live(`p-${d}`)]);
      days[d] = [Math.max(v, days[d]?.[0] || 0), Math.max(p, days[d]?.[1] || 0)];
    }
    const N = 30, rows = [];
    for (let i = N - 1; i >= 0; i--) { const d = kstDay(i); rows.push({ d, v: days[d]?.[0] || 0, p: days[d]?.[1] || 0 }); }
    const sum = rows.reduce((a, r) => a + r.v, 0), all = Object.values(days).reduce((a, x) => a + x[0], 0);
    const md = (d) => `${+d.slice(4, 6)}/${+d.slice(6, 8)}`;
    // 막대그래프 (단일 계열: 방문 기기 수)
    const W = 360, H = 170, L = 26, B = 20, T = 8, cw = (W - L) / N, bw = Math.max(cw - 2, 2);
    const max = Math.max(4, ...rows.map((r) => r.v)), step = Math.ceil(max / 4), top = step * 4;
    const y = (v) => T + (H - T - B) * (1 - v / top);
    const bar = (x, v) => { const h = H - B - y(v); if (v <= 0) return ""; const r = Math.min(4, bw / 2, h);
      return `M${x},${H - B}V${y(v) + r}Q${x},${y(v)} ${x + r},${y(v)}H${x + bw - r}Q${x + bw},${y(v)} ${x + bw},${y(v) + r}V${H - B}Z`; };
    const grid = [0, 1, 2, 3, 4].map((k) => `<line class="grid" x1="${L}" x2="${W}" y1="${y(step * k)}" y2="${y(step * k)}"/>
      <text class="axis" x="${L - 5}" y="${y(step * k) + 3}" text-anchor="end">${step * k}</text>`).join("");
    const bars = rows.map((r, i) => { const x = L + i * cw + 1;
      return `<rect class="hit" data-i="${i}" x="${L + i * cw}" y="${T}" width="${cw}" height="${H - T - B}"/><path class="bar" d="${bar(x, r.v)}"/>
        ${i % 7 === 2 || i === N - 1 ? `<text class="axis" x="${x + bw / 2}" y="${H - 5}" text-anchor="middle">${i === N - 1 ? "오늘" : md(r.d)}</text>` : ""}`; }).join("");
    if (!document.body.contains(host)) return;
    host.innerHTML = `<div class="weekly-head"><h2>방문 통계</h2><span class="wk">개발자용</span></div>
      <div class="stat-tiles">
        <div class="stat-tile"><span>오늘</span><b>${rows[N - 1].v.toLocaleString()}</b><small>열기 ${rows[N - 1].p.toLocaleString()}회</small></div>
        <div class="stat-tile"><span>어제</span><b>${rows[N - 2].v.toLocaleString()}</b><small>열기 ${rows[N - 2].p.toLocaleString()}회</small></div>
        <div class="stat-tile"><span>최근 30일</span><b>${sum.toLocaleString()}</b><small>누적 ${all.toLocaleString()}</small></div>
      </div>
      <figure class="chart-card" id="chart"><h3>일별 방문 기기 수 · 최근 30일</h3>
        <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 30일 일별 방문 기기 수 막대그래프">${grid}${bars}</svg>
        <div class="chart-tip" hidden></div>
        <details class="chart-table"><summary>표로 보기</summary><table><thead><tr><th>날짜</th><th>방문 기기</th><th>앱 열기</th></tr></thead>
          <tbody>${rows.slice().reverse().map((r) => `<tr><td>${md(r.d)}</td><td>${r.v}</td><td>${r.p}</td></tr>`).join("")}</tbody></table></details>
      </figure>
      <p class="credit">같은 기기는 하루 한 번만 세요(방문 기기). '앱 열기'는 앱을 새로 연 횟수예요. 한국시간 자정 기준. 개인정보 없이 숫자만 세요.</p>`;
    const card = host.querySelector("#chart"), tip = card.querySelector(".chart-tip"), svg = card.querySelector("svg");
    const show = (el) => {
      const r = rows[+el.dataset.i];
      card.querySelectorAll(".bar.on").forEach((b) => b.classList.remove("on")); el.nextElementSibling.classList.add("on");
      const box = el.getBoundingClientRect(), cb = card.getBoundingClientRect(), sb = svg.getBoundingClientRect();
      const x = Math.min(Math.max(box.left + box.width / 2 - cb.left, 70), cb.width - 70);
      tip.innerHTML = `<b>${md(r.d)}</b><br>방문 기기 ${r.v.toLocaleString()} · 열기 ${r.p.toLocaleString()}`;
      tip.style.left = x + "px"; tip.style.top = (sb.top - cb.top + (y(r.v) / H) * sb.height - 6) + "px"; tip.hidden = false;
    };
    svg.addEventListener("pointerover", (e) => { if (e.target.classList.contains("hit")) show(e.target); });
    svg.addEventListener("click", (e) => { if (e.target.classList.contains("hit")) show(e.target); });
    svg.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse") { tip.hidden = true; card.querySelectorAll(".bar.on").forEach((b) => b.classList.remove("on")); } });
  }

  // ── 이번 주 날씨 (Open-Meteo, 무료·키 없음). 정해 둔 지역 좌표만 보내고 사용자 위치는 쓰지 않는다 ──
  const WX_REGIONS = [["서울", 37.5665, 126.978, "서울"], ["인천", 37.4563, 126.7052, "인천"], ["춘천", 37.8813, 127.7298, "춘천시"],
    ["강릉", 37.7519, 128.8761, "강릉시"], ["대전", 36.3504, 127.3845, "대전"], ["청주", 36.6424, 127.489, "청주시"],
    ["전주", 35.8242, 127.148, "전주시"], ["광주", 35.1595, 126.8526, "광주"], ["여수", 34.7604, 127.6622, "여수시"],
    ["대구", 35.8714, 128.6014, "대구"], ["경주", 35.8562, 129.2247, "경주시"], ["부산", 35.1796, 129.0756, "부산"],
    ["통영", 34.8544, 128.4331, "통영시"], ["제주", 33.4996, 126.5312, "제주시"]];
  function wxIcon(c) {
    if (c === 0) return ["☀️", "맑음"]; if (c <= 2) return ["🌤️", "구름 조금"]; if (c === 3) return ["☁️", "흐림"];
    if (c <= 48) return ["🌫️", "안개"]; if (c <= 57) return ["🌦️", "이슬비"]; if (c <= 67) return ["🌧️", "비"];
    if (c <= 77) return ["❄️", "눈"]; if (c <= 82) return ["🌦️", "소나기"]; if (c <= 86) return ["🌨️", "눈"]; return ["⛈️", "뇌우"];
  }
  async function loadWeather() {
    try { const c = JSON.parse(localStorage.getItem("wx") || "null"); if (c && Date.now() - c.at < 3600e3) return c.data; } catch { /* 없음 */ }
    const q = new URLSearchParams({ latitude: WX_REGIONS.map((r) => r[1]).join(","), longitude: WX_REGIONS.map((r) => r[2]).join(","),
      daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max", timezone: "Asia/Seoul", forecast_days: "8" });
    const res = await fetch(`https://api.open-meteo.com/v1/forecast?${q}`);
    if (!res.ok) throw new Error("weather");
    let data = await res.json(); if (!Array.isArray(data)) data = [data];
    data = data.map((x) => x.daily);
    try { localStorage.setItem("wx", JSON.stringify({ at: Date.now(), data })); } catch { /* 저장 불가 */ }
    return data;
  }
  async function renderWeather() {
    const box = document.getElementById("wx");
    if (!box) return;
    let data;
    try { data = await loadWeather(); } catch { box.remove(); return; }
    if (!document.body.contains(box)) return;
    let ri = Math.max(0, WX_REGIONS.findIndex((r) => r[0] === store.get("wxRegion")));
    const draw = () => {
      const d = data[ri], [name, , , cityName] = WX_REGIONS[ri];

  // ── 거리·이동시간 추정 (직선거리 × 도로 보정) ──
  function km(a, b) {
    const R = 6371, r = Math.PI / 180;
    const dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function estimate(a, b) {

  // 도장판 공유 이미지 (1080×1350, 인스타 세로)
  async function shareStamps() {
    const cities = state.index.cities.filter((c) => !(c.updatedAt && !c.hasData));
    const n = cities.filter((c) => visited.has(c.id)).length;
    const W = 1080, H = 1350, cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    const g = cv.getContext("2d");
    const grad = g.createLinearGradient(0, 0, W * 0.4, H);
    grad.addColorStop(0, "#22B79A"); grad.addColorStop(0.55, "#12907A"); grad.addColorStop(1, "#0B6E61");
    g.fillStyle = grad; g.fillRect(0, 0, W, H);
    await document.fonts.load('80px "Jua"').catch(() => {});
    const font = (px) => `${px}px "Jua", "Apple SD Gothic Neo", sans-serif`;
    g.fillStyle = "#fff"; g.font = font(64); g.fillText("나의 국내여행 도장깨기", 80, 140);
    g.font = font(220); g.fillText(String(n), 80, 400);
    const w = g.measureText(String(n)).width;
    g.font = font(72); g.globalAlpha = .85; g.fillText(`/ ${cities.length}곳`, 100 + w, 400); g.globalAlpha = 1;
    g.font = font(60); g.fillStyle = "#FFF3DC"; g.fillText(levelOf(n), 80, 500);
    // 시·도별 막대
    const byProv = new Map();
    for (const c of cities) {
      const key = c.province === c.name ? "특별·광역시" : c.province;
      const v = byProv.get(key) || [0, 0]; v[1]++; if (visited.has(c.id)) v[0]++; byProv.set(key, v);
    }
    const rows = [...byProv].sort((a, b) => b[1][0] / b[1][1] - a[1][0] / a[1][1]).slice(0, 9);
    let y = 600;
    g.font = font(38);
    for (const [prov, [k, t]] of rows) {
      g.fillStyle = "#fff"; g.fillText(prov.replace(/특별자치도|특별자치시|광역시|특별시/, ""), 80, y + 34);
      g.fillStyle = "rgba(255,255,255,.22)"; g.beginPath(); g.roundRect(330, y + 6, 560, 34, 17); g.fill();
      if (k) { g.fillStyle = "#FFF3DC"; g.beginPath(); g.roundRect(330, y + 6, Math.max(34, 560 * k / t), 34, 17); g.fill(); }
      g.fillStyle = "#fff"; g.fillText(`${k}/${t}`, 915, y + 34);
      y += 64;
    }
    const img = new Image(); img.src = "icons/mascot-360.png";
    await img.decode().catch(() => {});
    if (img.naturalWidth) g.drawImage(img, W - 380, 210, 300, 300 * img.naturalHeight / img.naturalWidth);
    g.fillStyle = "#fff"; g.font = font(44); g.fillText("어디갈래", 80, H - 90);
    g.globalAlpha = .8; g.font = font(30); g.fillText("lloydknam.github.io/eodigallae", 80, H - 45); g.globalAlpha = 1;
    const blob = await new Promise((ok) => cv.toBlob(ok, "image/png"));
    const file = new File([blob], "eodigallae-stamps.png", { type: "image/png" });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: "나의 도장깨기", text: `국내여행 도장깨기 ${n}/${cities.length}곳 — 어디갈래` });
        return;
      }
    } catch (e) { if (e && e.name === "AbortError") return; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "eodigallae-stamps.png";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  // ── 전국 핫플 지도 (Leaflet + OpenStreetMap/CARTO 바탕지도) ──
  let mapData = null, leafletReady = null;
  function loadLeaflet() {
    if (window.L) return Promise.resolve();
    if (leafletReady) return leafletReady;
    leafletReady = new Promise((ok, fail) => {
      const css = document.createElement("link");
      css.rel = "stylesheet"; css.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";
      document.head.appendChild(css);
      const js = document.createElement("script");
      js.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
      js.onload = ok; js.onerror = fail;
      document.head.appendChild(js);
    });
    return leafletReady;
  }
  async function renderMap() {
    const box = document.getElementById("hotmap");
    if (!box) return;
    try {
      if (!mapData) {
        const r = await fetch("data/map.json", { cache: "no-cache" });
        mapData = r.ok ? await r.json() : null;
      }
      if (!mapData || !mapData.cities.length) { box.closest(".map-sec").hidden = true; return; }
      await loadLeaflet();
    } catch {
      box.innerHTML = `<p class="map-wait">지도를 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.</p>`;
      return;
    }
    if (!document.body.contains(box)) return;
    document.getElementById("map-at").textContent = (mapData.updatedAt || "").slice(5, 10).replace("-", ".") + " 업데이트";
    box.innerHTML = "";
    const dark = false;   // 앱은 항상 밝은 화면
    // 한 손가락으로 끌어서 이동, 두 손가락으로 확대·축소 (화면 스크롤은 지도 바깥에서)
    const map = L.map(box, { zoomControl: true, scrollWheelZoom: false, attributionControl: true, minZoom: 6, maxZoom: 15,
      dragging: true })
      .fitBounds([[33.1, 125.0], [38.6, 130.0]]);
    // 바탕지도: 오픈스트리트맵 공식 타일 (키 불필요, 출처 표시 필수). 어두운 모드는 색을 뒤집어 맞춘다.
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 기여자',
    }).addTo(map);
    box.classList.toggle("dark-tiles", dark);
    const maxV = Math.max(...mapData.cities.map((c) => c.views || 0), 1);
    const css = getComputedStyle(document.documentElement);
    const teal = css.getPropertyValue("--celadon").trim() || "#12907A";
    for (const c of mapData.cities) {
      const r = 10 + 30 * Math.sqrt((c.views || 0) / maxV);
      L.circleMarker([c.lat, c.lng], { radius: r, color: teal, weight: 2, fillColor: teal, fillOpacity: 0.28 })
        .addTo(map)
        .bindPopup(`<div class="mpop"><b>${esc(c.name)}</b><span>최근 6개월 영상 조회 ${fmtViews(c.views || 0)}회</span>
          ${c.top.length ? `<span>요즘 뜨는 곳: ${c.top.map(esc).join(", ")}</span>` : ""}
          <a href="#${enc(c.id)}" data-city="${esc(c.id)}">도시 보기 →</a></div>`);
    }
    const pins = mapData.spots.map((s, i) => {
      const icon = L.divIcon({ className: "", iconSize: [30, 30], iconAnchor: [15, 15],
        html: `<span class="mpin${i < 3 ? " top" : ""}">${i + 1}</span>` });
      return L.marker([s.lat, s.lng], { icon, zIndexOffset: 1000 - i, title: s.name })
        .bindPopup(`<div class="mpop">
          ${s.thumb ? `<img src="${esc(s.thumb)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}
          <b>${i + 1}. ${esc(s.name)}</b><span>${esc(s.city)} · 조회 ${fmtViews(s.views)}회 · 영상 ${s.n}편</span>
          ${s.week ? `<span class="mweek">이번 주 유튜브 ${s.week}위</span>` : ""}
          <span class="mlinks">${s.video ? `<a href="${ytWatch(s.video)}" target="_blank" rel="noopener">영상 보기 ↗</a>` : ""}
          <a href="#${enc(s.cityId)}" data-city="${esc(s.cityId)}">도시 보기 →</a></span></div>`, { maxWidth: 240 });
    });
    const layer = L.layerGroup().addTo(map);
    const sync = () => {   // 멀리서는 상위 15곳만, 확대하면 60곳 전부
      layer.clearLayers();
      const n = map.getZoom() >= 9 ? pins.length : 15;
      pins.slice(0, n).forEach((m) => layer.addLayer(m));
    };
    map.on("zoomend", sync);
    sync();
  }

  // ── 인파지도 (서울시 실시간 인구데이터, 30분마다 수집) ──
  // 파스텔 색(채움) + 같은 계열 진한 색(테두리)
  const LIVE_LV = [["붐빔", "#F0675A", "#C33E31"], ["약간 붐빔", "#F59A4C", "#C96F22"], ["보통", "#EDBE34", "#A8841A"], ["여유", "#3FB883", "#24845A"]];
  const lvLine = (l) => (LIVE_LV.find(([k]) => k === l) || [, , "#8A939C"])[2];
  const lvKey = (l) => ["busy", "warm", "mid", "calm"][lvRank(l)] || "calm";
  const lvRank = (l) => { const i = LIVE_LV.findIndex(([k]) => k === l); return i < 0 ? 9 : i; };
  const lvColor = (l) => (LIVE_LV.find(([k]) => k === l) || [, "#9AA4AE"])[1];
  const fmtPpl = (n) => n == null ? "" : n >= 10000 ? `${(n / 10000).toFixed(n >= 100000 ? 0 : 1).replace(/\.0$/, "")}만` : n.toLocaleString();
  const pplRange = (a, b) => a == null ? "" : `약 ${fmtPpl(a)}~${fmtPpl(b)}명`;
  let liveData = null;
  async function renderLiveMap() {
    const box = document.getElementById("hotmap");
    if (!box) return;
    try {
      const r = await fetch("data/live/seoul.json", { cache: "no-cache" });
      liveData = r.ok ? await r.json() : null;
      await loadLeaflet();
    } catch { liveData = liveData || null; }
    if (!document.body.contains(box)) return;
    const list = document.getElementById("live-list");
    if (!liveData || !window.L) {
      box.innerHTML = `<p class="map-wait">실시간 인파 자료를 준비하고 있어요. 조금만 기다려 주세요!</p>`;
      return;
    }
    const at = new Date(liveData.at), age = (Date.now() - at) / 60000;
    document.getElementById("map-at").textContent = `${at.getMonth() + 1}/${at.getDate()} ${String(at.getHours()).padStart(2, "0")}:${String(at.getMinutes()).padStart(2, "0")} 기준${age > 40 ? " · 업데이트가 늦어지고 있어요" : ""}`;
    box.innerHTML = "";
    const map = L.map(box, { zoomControl: true, scrollWheelZoom: false, minZoom: 10, maxZoom: 16, dragging: true });
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 기여자 · <a href="https://data.seoul.go.kr" target="_blank" rel="noopener">data.seoul.go.kr</a>',
    }).addTo(map);
    const ps = liveData.places.filter((p) => p.lat != null);
    const maxP = Math.max(...ps.map((p) => p.max || 0), 1);
    const pop = (p) => `<div class="mpop"><b>${esc(p.name)}</b>
      <span><em class="lvchip" style="background:${lvColor(p.lvl)}">${esc(p.lvl || "정보 없음")}</em> ${pplRange(p.min, p.max)}</span>
      ${p.msg ? `<span>${esc(p.msg)}</span>` : ""}
      ${p.fc?.length ? `<span class="mfc">${p.fc.slice(0, 3).map(([t, l]) => `${esc(t)} ${esc(l)}`).join(" → ")}</span>` : ""}
      <span>${esc((p.time || "").slice(-5))} 기준 · ${esc(p.cat)}</span></div>`;
    // 서울 전체가 한눈에 보이는 축척(11)으로 시작 — 휴대폰·PC 모두 같은 축척
    map.setView([37.553, 126.99], 11, { animate: false });
    window.__crowdMap = map;   // 홍보 영상 녹화용
    const marks = new Map();
    ps.sort((a, b) => lvRank(b.lvl) - lvRank(a.lvl));   // 붐비는 곳이 위에 오게
    for (const p of ps) {
      const c = lvColor(p.lvl);
      const m = L.circleMarker([p.lat, p.lng], { radius: 6, color: lvLine(p.lvl), weight: 1.5, opacity: 1, fillColor: c, fillOpacity: 0.95,
        className: `lv-pulse lv-${lvKey(p.lvl)}` }).addTo(map).bindPopup(pop(p), { maxWidth: 250 });
      const el = m.getElement(); if (el) el.style.animationDelay = `${(-Math.random() * 4).toFixed(2)}s`;   // 제각각 깜빡이게
      m._base = 4 + 9 * Math.sqrt((p.max || 0) / maxP);
      if (lvRank(p.lvl) <= 1) {   // 붐빔·약간 붐빔
        const ring = L.circleMarker([p.lat, p.lng], { radius: 6, color: lvLine(p.lvl), weight: 2, fill: false, interactive: false,
          className: `lv-ring lv-${lvKey(p.lvl)}` }).addTo(map);
        const re = ring.getElement(); if (re && el) re.style.animationDelay = el.style.animationDelay;
        m._ring = ring; ring.bringToBack();
      }
      m.bindTooltip(esc(p.name.replace(/\(2호선\)/, "")), { permanent: true, direction: "right", offset: [6, 0], className: "lv-label", interactive: false });
      marks.set(p.cd, m);
    }
    // 멀리서 보면 작게, 확대할수록 크게 (121곳이 서로 덮지 않게)
    const resize = () => { const k = Math.min(1.8, Math.max(0.7, 0.7 + 0.35 * (map.getZoom() - 11)));
      marks.forEach((m) => { m.setRadius(m._base * k); m._ring?.setRadius(m._base * k); }); };
    // 장소 이름: 서울 전체 화면(11)에선 붐빔·약간 붐빔만, 한 단계 확대(12)부터는 모두.
    // 겹치면 붐비는 곳·사람 많은 곳 이름을 먼저 보여주고 나머지는 숨긴다
    const order = [...ps].sort((a, b) => lvRank(a.lvl) - lvRank(b.lvl) || (b.max || 0) - (a.max || 0)).map((p) => marks.get(p.cd));
    const labels = () => {
      const z = map.getZoom(), kept = [];
      box.classList.toggle("far", z < 13);
      for (const m of order) {
        const busy = m._ring != null;
        if (z < 11 || (z < 12 && !busy)) { m.closeTooltip(); continue; }
        m.openTooltip();
        const el = m.getTooltip()?.getElement(); if (!el) continue;
        const r = el.getBoundingClientRect();
        const hit = kept.some((k) => r.left < k.right + 2 && r.right > k.left - 2 && r.top < k.bottom + 1 && r.bottom > k.top - 1);
        if (hit) m.closeTooltip(); else kept.push(r);
      }
    };
    map.on("zoomend", () => { resize(); labels(); }); map.on("moveend", labels); resize(); labels();
    if (list) {
      const top = [...liveData.places].sort((a, b) => lvRank(a.lvl) - lvRank(b.lvl) || (b.max || 0) - (a.max || 0));
      const calm = top.filter((p) => p.lvl === "여유" && p.cat !== "인구밀집지역").sort((a, b) => (a.max || 0) - (b.max || 0));
      const row = (p) => `<li><button class="live-row" data-live="${esc(p.cd)}"><i style="background:${lvColor(p.lvl)}"></i>
        <b>${esc(p.name)}</b><span>${esc(p.lvl)} · ${pplRange(p.min, p.max)}</span></button></li>`;
      list.innerHTML = `<h3 class="live-h">지금 가장 붐비는 곳</h3><ol class="live-list">${top.slice(0, 8).map(row).join("")}</ol>
        ${calm.length ? `<h3 class="live-h">지금 한산한 나들이 장소</h3><ol class="live-list">${calm.slice(0, 6).map(row).join("")}</ol>` : ""}
        ${liveData.sample ? `<p class="plan-note"><b>준비 중:</b> 지금은 시험용으로 광화문 한 곳만 보여요. 곧 서울 주요 121곳으로 늘어나요.</p>` : ""}
        <p class="plan-note">출처: 서울시 실시간 인구데이터(서울 주요 ${liveData.places.length}곳). 통신 데이터로 추정한 값이라 실제와 다를 수 있어요.</p>`;
      list.onclick = (e) => {
        const b = e.target.closest("[data-live]"); if (!b) return;
        const m = marks.get(b.dataset.live); if (!m) return;
        box.scrollIntoView({ behavior: "smooth", block: "center" });
        map.setView(m.getLatLng(), 14); m.openPopup();
      };
    }
  }

  // 도시별 유튜브 조회수 Top 10 (최근 6개월 영상 중 그 장소가 나온 영상들의 조회수 합)

  const tabBtn = (id, label, n) =>

  function renderPanel() {

  // 코스 패널: 노선도 + 동선 스케치
  function coursePanel() {
    const d = state.city;
    if (!d.courses.length) return `<div class="empty-card"><h4>아직 추천 코스가 없어요</h4><p>관광지 탭에서 가고 싶은 곳을 먼저 둘러보세요.</p></div>`;
    const c = d.courses[Math.min(state.course, d.courses.length - 1)];
    const day = c.days[Math.min(state.day, c.days.length - 1)];
    const stops = resolveStops(day.stops);
    return `
      <div class="course-pick" role="group" aria-label="코스">${d.courses.map((x, i) =>
        `<button class="chip" data-course="${i}" aria-pressed="${i === state.course}">${esc(x.title)}</button>`).join("")}</div>
      ${c.summary ? `<p class="course-summary">${esc(c.summary)}</p>` : ""}
      ${c.days.length > 1 ? `<div class="days" role="group" aria-label="일차">${c.days.map((x, i) =>
        `<button data-day="${i}" aria-pressed="${i === state.day}">${esc(x.label)}</button>`).join("")}</div>` : ""}
      <div class="course-grid">
        <ol class="line">${lineHTML(stops)}</ol>
        ${sketchHTML(stops)}
      </div>`;
  }

  function resolveStops(raw) {
    const d = state.city;
    const out = [];
    for (const s of raw) {
      if (s.kind === "spot") {
        const spot = d.spotMap.get(s.id);
        if (spot) out.push({ kind: "spot", spot, note: s.note, place: spot });
      } else if (s.kind === "meal") {
        const food = s.id ? d.foodMap.get(s.id) : null;
        const near = d.spotMap.get(s.near) || (food ? null : out.at(-1)?.place);
        const place = food || near;
        if (place) out.push({ kind: "meal", food, near, note: s.note, place });
      }
    }
    return out;
  }

  function lineHTML(stops) {
    let n = 0, html = "";
    const total = { min: 0, km: 0 };
    stops.forEach((s, i) => {
      if (i > 0) {
        const prev = stops[i - 1].place;
        if (prev !== s.place && km(prev, s.place) > 0.05) {
          const e = estimate(prev, s.place);
          total.min += e.min; total.km += e.km;
          html += `<li class="leg" aria-label="이동"><span class="rail"></span>
            <div class="info"><b>${e.mode}</b> 약 ${fmtMin(e.min)} · ${fmtKm(e.km)}
              <a href="${kakaoRoute(prev, s.place)}" target="_blank" rel="noopener">길찾기 ↗</a></div></li>`;
        }
      }
      if (s.kind === "spot") {
        n++;
        const sp = s.spot;
        const video = sp.videos?.[0];
        html += `<li class="stop"><span class="rail"><span class="dot">${n}</span></span>
          <div class="content">
            ${s.note ? `<span class="note">${esc(s.note)}</span>` : ""}
            <h4>${esc(sp.name)}${sp.hot ? `<span class="rank hot">요즘 뜨는 ${sp.hot}위</span>` : ""}${sp.rank ? `<span class="rank">인기 ${sp.rank}위</span>` : ""}</h4>
            ${sp.desc ? `<p class="desc">${esc(sp.desc)}</p>` : ""}
            ${crowdHTML(sp.id)}
            <div class="links">
              <a href="${video ? ytWatch(video.id) : ytSearch(state.city.name, sp.name)}" target="_blank" rel="noopener">${video ? "영상 보기" : "영상 찾기"} ↗</a>
              <a href="${kakaoPin(sp)}" target="_blank" rel="noopener">지도 ↗</a>
            </div>
          </div></li>`;
      } else {
        const titleHTML = s.food
          ? esc(s.food.name) + (s.food.rank ? `<span class="rank">인기 ${s.food.rank}위</span>` : "")
          : `${esc(s.near.name)} 주변 식당`;
        const link = s.food ? kakaoPin(s.food) : kakaoSearch(`${baseCity(state.city.name)} ${s.near.name} 맛집`);
        html += `<li class="stop meal"><span class="rail"><span class="dot"></span></span>
          <div class="content">
            ${s.note ? `<span class="note">${esc(s.note)}</span>` : ""}
            <h4>${titleHTML}</h4>
            <div class="links"><a href="${link}" target="_blank" rel="noopener">${s.food ? "지도" : "식당 찾아보기"} ↗</a></div>
          </div></li>`;
      }
    });
    if (total.min) html += `<li class="estimate-note" style="list-style:none;padding-left:46px">이동만 약 ${fmtMin(total.min)} · ${fmtKm(total.km)}</li>`;
    return html;
  }

  // 동선 스케치: 위경도를 화면 좌표로 바로 투영한 SVG (지도 타일 없이 동선의 모양만)
  function sketchHTML(stops) {
    const pts = []; const seen = new Set();
    let n = 0;
    for (const s of stops) {
      if (s.kind === "spot") { n++; if (!seen.has(s.spot.id)) { seen.add(s.spot.id); pts.push({ ...s.spot, n }); } }
    }
    if (pts.length < 2) return "";
    const W = 240, H = 200, pad = 22;
    const lat0 = pts.reduce((a, p) => a + p.lat, 0) / pts.length;
    const k = Math.cos(lat0 * Math.PI / 180);
    const xs = pts.map((p) => p.lng * k), ys = pts.map((p) => p.lat);
    const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
    const span = Math.max(maxX - minX, maxY - minY, 0.002);
    const sc = Math.min((W - pad * 2) / Math.max(maxX - minX, span * 0.35), (H - pad * 2) / Math.max(maxY - minY, span * 0.35));
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    const P = pts.map((p) => ({ x: W / 2 + (p.lng * k - cx) * sc, y: H / 2 - (p.lat - cy) * sc, n: p.n, name: p.name }));
    const spanKm = km({ lat: minY, lng: minX / k }, { lat: maxY, lng: maxX / k });
    const grid = [];
    for (let gx = 20; gx < W; gx += 20) grid.push(`<line x1="${gx}" y1="0" x2="${gx}" y2="${H}"/>`);
    for (let gy = 20; gy < H; gy += 20) grid.push(`<line x1="0" y1="${gy}" x2="${W}" y2="${gy}"/>`);
    const first = pts[0], last = pts[pts.length - 1];
    return `<figure class="sketch" style="margin:0">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="코스 동선 스케치">
        <g stroke="var(--line)" stroke-width="1" fill="none">${grid.join("")}</g>
        <polyline points="${P.map((p) => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ")}" fill="none" stroke="var(--celadon)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
        ${P.map((p) => `<g><circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="9" fill="var(--surface)" stroke="var(--celadon)" stroke-width="3"/>
          <text x="${p.x.toFixed(1)}" y="${(p.y + 3.6).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ink)" font-family="IBM Plex Sans KR, sans-serif">${p.n}</text></g>`).join("")}
        <text x="${W - 6}" y="14" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Sans KR, sans-serif">N ↑</text>
      </svg>
      <figcaption class="cap"><span>동선 범위 약 ${fmtKm(spanKm)}</span>
        <a href="${kakaoRoute(first, last)}" target="_blank" rel="noopener">카카오맵으로 보기 ↗</a></figcaption>
    </figure>`;
  }

  // 관광지 패널: 사진을 누르면 영상으로
  function spotsPanel() {
    const d = state.city;
    const hasHot = d.spots.some((s) => s.hot);
    const sort = hasHot ? state.sort : "rank";
    const list = [...d.spots].sort(sort === "hot"
      ? (a, b) => (a.hot || 999) - (b.hot || 999) || (a.rank || 999) - (b.rank || 999)
      : (a, b) => (a.rank || 999) - (b.rank || 999) || (a.hot || 999) - (b.hot || 999));
    const toggle = hasHot ? `<div class="course-pick" role="group" aria-label="정렬" style="margin-bottom:14px">
        <button class="chip" data-sort="hot" aria-pressed="${sort === "hot"}">요즘 뜨는 순</button>
        <button class="chip" data-sort="rank" aria-pressed="${sort === "rank"}">대표 명소 순</button></div>
      ${sort === "hot" ? `<p class="course-summary" style="margin:-4px 0 14px">최근 6개월 유튜브 여행 영상에 많이 나오고 많이 본 곳 순서예요.</p>` : ""}` : "";
    return `${toggle}<div class="spots">${list.map((s) => {
      const v = s.videos || [];
      const href = v[0] ? ytWatch(v[0].id) : ytSearch(d.name, s.name);
      const foods = (s.foods || []).map((id) => d.foodMap.get(id)).filter(Boolean);
      const badges = [
        s.hot && sort === "hot" ? `<span class="rank hot">요즘 뜨는 ${s.hot}위</span>` : "",
        s.rank && sort === "rank" ? `<span class="rank">인기 ${s.rank}위</span>` : "",
        s.hot && sort === "rank" ? `<span class="rank hot">요즘 뜨는 ${s.hot}위</span>` : "",
        s.rank && sort === "hot" ? `<span class="rank">인기 ${s.rank}위</span>` : "",
      ].join("");
      return `<article class="spot" id="spot-${esc(s.id)}">
        <a class="photo" href="${href}" target="_blank" rel="noopener" aria-label="${esc(s.name)} 영상 보기">
          ${art(s.id, s.name, s.image)}
          <span class="play">${playIcon}${v.length ? `영상 ${s.yt ? s.yt.n : v.length}편` : "영상 찾기"}</span>
        </a>
        <div class="body">
          <h4>${esc(s.name)}${badges}</h4>
          ${s.cat ? `<span class="addr">${esc(s.cat)} · 카카오맵 장소</span>` : ""}
          ${s.addr ? `<span class="addr">${esc(s.addr)}</span>` : ""}
          ${s.yt ? `<span class="buzz">최근 영상 ${s.yt.n}편 · 조회 ${fmtViews(s.yt.views)}회</span>` : ""}
          ${crowdHTML(s.id)}
          ${s.desc ? `<p class="desc">${esc(s.desc)}</p>` : ""}
          ${v.length > 1 ? `<ul class="vids">${v.slice(1, 4).map((x) => `<li><a href="${ytWatch(x.id)}" target="_blank" rel="noopener">
              <span class="th">${x.thumb ? `<img src="${esc(x.thumb)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</span>
              <span><span class="t">${esc(x.title)}</span><span class="c">${esc(x.channel)} · ${esc(x.published)}${x.views ? ` · 조회 ${fmtViews(x.views)}` : ""}</span></span></a></li>`).join("")}</ul>` : ""}
          ${foods.length ? `<span class="addr">근처 식당: ${foods.map((f) => esc(f.name)).join(", ")}</span>` : ""}
          <div class="links">
            ${heartBtn(s)}
            <a href="${igTag(s.name)}" target="_blank" rel="noopener">인스타그램 #${esc(s.name.replace(/\s+/g, ""))} ↗</a>
            <a href="${kakaoPin(s)}" target="_blank" rel="noopener">${s.kakao ? "카카오맵·리뷰" : "지도"} ↗</a>
          </div>
        </div>
      </article>`;
    }).join("")}</div>`;
  }

  // 맛집 패널
  function foodPanel() {
    const d = state.city;
    const city = baseCity(d.name);
    const spec = (d.specialties || []).length ? `<div class="specialties">${d.specialties.map((x) =>
      `<a href="${kakaoSearch(`${city} ${x}`)}" target="_blank" rel="noopener">${esc(x)}</a>`).join("")}</div>` : "";
    if (!d.restaurants.length) {
      return `<div class="empty-card">
        <h4>${esc(city)}에서 먹어볼 것</h4>
        ${spec}
        <p>관광공사에 등록된 음식점은 API를 연결하면 관광지별로 묶여서 보여요. 지금은 메뉴를 누르면 카카오맵 검색으로 연결돼요.</p>
        <a class="btn-link" href="${kakaoSearch(`${city} 맛집`)}" target="_blank" rel="noopener">카카오맵에서 ${esc(city)} 맛집 보기 ↗</a>
      </div>`;
    }
    const nearOf = new Map();
    for (const s of d.spots) for (const id of s.foods || []) { if (!nearOf.has(id)) nearOf.set(id, s.name); }
    return `${spec ? `<div style="margin-bottom:14px">${spec}</div>` : ""}<div class="foods">${d.restaurants.map((f) => `
      <article class="food">
        <h4>${esc(f.name)}${f.rank ? `<span class="rank">인기 ${f.rank}위</span>` : ""}</h4>
        ${nearOf.has(f.id) ? `<span class="near">${esc(nearOf.get(f.id))} 근처</span>` : ""}
        ${f.addr ? `<span class="addr">${esc(f.addr)}</span>` : ""}
        <div class="links"><a href="${kakaoPin(f)}" target="_blank" rel="noopener">지도·리뷰 ↗</a>${f.tel ? `<span class="addr">${esc(f.tel)}</span>` : ""}</div>
      </article>`).join("")}</div>`;
  }

  // ── 오른쪽 위 전체 메뉴 ──
  const menuBtn = document.getElementById("menu-btn"), menuDrop = document.getElementById("menu-drop");
  const setMenu = (open) => { menuDrop.hidden = !open; menuBtn.setAttribute("aria-expanded", open); };
  menuBtn.addEventListener("click", (e) => { e.stopPropagation(); setMenu(menuDrop.hidden); });
  document.addEventListener("click", (e) => { if (!menuDrop.hidden && !e.target.closest("#menu-drop, #menu-btn")) setMenu(false); }, true);
  menuDrop.addEventListener("click", () => setTimeout(() => setMenu(false)));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !menuDrop.hidden) { setMenu(false); menuBtn.focus(); } });
  window.addEventListener("hashchange", () => setMenu(false));

  // ── 이벤트 위임 ──
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-city],[data-home],[data-prov],[data-tab],[data-course],[data-day],[data-sort],[data-list],[data-spot],[data-view],[data-stamp],[data-share-stamps],[data-half-go],[data-heart],[data-unheart],[data-share-plan],[data-clear-plan],[data-take-plan],[data-take-video],[data-share-video]");
    if (!t) return;
    if (t.dataset.stamp) {
      const id = t.dataset.stamp;
      if (visited.has(id)) visited.delete(id); else visited.add(id);
      saveVisited();
      if (location.hash === "#me") showMePage();
      else t.outerHTML = stampBtn(id);
      return;
    }
    if ("shareStamps" in t.dataset) { shareStamps(); return; }
    if (t.dataset.heart) {
      const d = state.city, s = d && d.spotMap.get(t.dataset.heart);
      if (!s) return;
      if (inPlan(s.id)) plan = plan.filter((p) => p.id !== s.id);
      else { plan.push(planItem(s, d)); toast(`'${s.name}'을(를) 내 코스에 담았어요`); }
      savePlan(); t.outerHTML = heartBtn(s); return;
    }
    if (t.dataset.unheart) { plan = plan.filter((p) => p.id !== t.dataset.unheart); savePlan(); showMePage(); return; }
    if ("sharePlan" in t.dataset) { sharePlan(); return; }
    if ("clearPlan" in t.dataset) { plan = []; savePlan(); showMePage(); return; }
    if ("takePlan" in t.dataset) {
      for (const p of state.sharedPlan || []) if (!inPlan(p.id)) plan.push(p);
      savePlan(); toast("내 코스에 담았어요"); go("me"); return;
    }
    if ("takeVideo" in t.dataset) {
      let n = 0;
      for (const p of state.videoPlan || []) {
        if (inPlan(p.id)) continue;
        // 카카오에서 실시간으로 받은 위치는 저장하지 않는다(카카오 정책). 관광공사 장소는 위치까지 저장.
        const keep = p.src === "tour" && p.lat != null;
        plan.push({ ...p, lat: keep ? p.lat : null, lng: keep ? p.lng : null }); n++;
      }
      savePlan(); toast(n ? `${n}곳을 내 코스에 담았어요` : "이미 다 담겨 있어요"); go("me"); return;
    }
    if (t.dataset.shareVideo) {
      const url = location.origin + location.pathname + "#video=" + t.dataset.shareVideo;
      (async () => {
        try { if (navigator.share) { await navigator.share({ title: "어디갈래 영상 코스", url }); return; } }
        catch (err) { if (err && err.name === "AbortError") return; }
        try { await navigator.clipboard.writeText(url); toast("코스 링크를 복사했어요"); } catch { prompt("이 링크를 복사해서 보내세요", url); }
      })();
      return;
    }
    if ("halfGo" in t.dataset) { state.prov = "반값여행"; state.q = ""; go("cities"); return; }
    if (t.dataset.view) { e.preventDefault(); go(t.dataset.view === "home" ? null : t.dataset.view); }
    else if (t.dataset.city) { e.preventDefault(); go(t.dataset.city); }
    else if ("home" in t.dataset) { e.preventDefault(); go(null); }
    else if (t.dataset.prov) {
      state.prov = t.dataset.prov;
      document.querySelectorAll("[data-prov]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.prov === state.prov));
      renderResults();
    } else if (t.dataset.tab) {
      state.tab = t.dataset.tab; store.set("tab", state.tab);
      document.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === state.tab));
      renderPanel();
    } else if (t.dataset.course) { state.course = +t.dataset.course; state.day = 0; renderPanel(); }
    else if (t.dataset.day) { state.day = +t.dataset.day; renderPanel(); }
    else if (t.dataset.list) { state.list = t.dataset.list; renderWeekly(); }
    else if (t.dataset.spot) {
      state.tab = "spots";
      document.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === "spots"));
      renderPanel();
      const el = document.getElementById("spot-" + t.dataset.spot);
      if (el) {
        el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
        el.classList.add("flash");
        setTimeout(() => el.classList.remove("flash"), 1600);
      }
    }
    else if (t.dataset.sort) { state.sort = t.dataset.sort; store.set("sort", state.sort); renderPanel(); }
  });

  // ── 시작 ──
  (() => {
    const q = new URLSearchParams(location.search);
    const shared = [q.get("url"), q.get("text"), q.get("title")].filter(Boolean).join(" ");
    const id = shared && ytIdOf(shared);
    if (id) history.replaceState(null, "", location.pathname + "#video=" + id);
  })();
  countVisit();
  loadIndex().then(route).catch((err) => {
    app.innerHTML = `<p class="empty-note">${esc(err.message)} 잠시 후 다시 열어 주세요.</p>`;
  });

  // 오프라인 캐시 (GitHub Pages 등 https 배포에서만)
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    try {
      const hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" })
        .then((reg) => reg.update()).catch(() => {});
      // 새 버전이 설치되면 한 번만 새로고침해서 바로 보여준다
      let reloaded = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (hadController && !reloaded) { reloaded = true; location.reload(); }
      });
    } catch { /* 미지원 환경 */ }
  }
})();
</script>
</body>
</html>
