<style>
:root{

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0B1218;--land:#17242C;--panel:#16222C;--ink:#E7EEF3;--muted:#93A4B1;--rule:#25323D;--water:#0C2438;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0B1218;--land:#17242C;--panel:#16222C;--ink:#E7EEF3;--muted:#93A4B1;--rule:#25323D;--water:#0C2438;color-scheme:dark}
html{box-sizing:border-box;height:100%}
body{box-sizing:border-box;height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;
  display:flex;flex-direction:column;gap:10px;
  padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex:none}
.top h1{margin:0;font-family:var(--f-display);font-weight: 700;font-size:23px;letter-spacing:-.01em}
.back{color:var(--muted);font-size:12px;text-decoration:none;display:inline-block;margin-bottom:2px}
.back:hover{color:var(--ink)}
.sub{margin:2px 0 0;color:var(--muted);font-size:12px}
.clock{text-align:right;flex:none}
.clock b{display:block;font: 700 30px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock small{color:var(--muted);font-size:11px}

.ctl{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font:600 14px var(--f-body);letter-spacing:.01em;min-width:44px}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{border:1px solid var(--rule);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--muted)}

.chips{display:flex;gap:6px;overflow-x:auto;flex:none;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:3px 10px 3px 3px;cursor:pointer;min-height:30px}
.chip .d{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--f-body);color:#fff}
.chip .nm{font-size:13px;font-weight:500}
.chip .c{font:500 14px var(--f-body);font-variant-numeric:tabular-nums;color:var(--muted);min-width:1.2em;text-align:right}
.chip.all{padding:3px 12px;font-size:13px}
.chip[aria-pressed="false"]{opacity:.42}

.map{position:relative;flex:1;min-height:0;border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--land)}
#map{position:absolute;inset:0;width:100%;height:100%}
.leaflet-tile-pane{filter:brightness(1.03)}
:root:not([data-theme="light"]) .leaflet-tile-pane,:root[data-theme="dark"] .leaflet-tile-pane{filter:brightness(.92)}
.leaflet-control-attribution{font-size:10px}
.st-pop{font:500 13px var(--f-body)}
.st-pop b{display:block;font-size:14px;margin-bottom:2px}
.st-pop .ln{display:inline-block;margin:2px 3px 0 0;padding:1px 7px;border-radius:999px;font:700 11px var(--f-body);color:#fff}
.tricon{pointer-events:auto;cursor:pointer}
.tricon.sel .ring{opacity:1!important}

.sheet{flex:none;background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who .dot{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--f-body);color:#fff}
.who strong{display:block;font-size:15px}
.who span.s{display:block;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:6px;flex:none}
.acts .btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.maker{flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px;color:var(--muted);font-size:11px}
.maker img{height:22px;display:block}
html.embed .top>div:first-child,html.embed .maker{display:none}
html.embed .top{justify-content:flex-end}
html.embed body{padding-top:8px;padding-bottom:8px}

<script>
(function(){
'use strict';

/* id:[이름, 위도, 경도, 주요역, (미사용)] */
var ST={
seoul:['서울',37.5547,126.9707],yongsan:['용산',37.5299,126.9648],cheongnyangni:['청량리',37.5800,127.0470],
gwangmyeong:['광명',37.4160,126.8847],suwon:['수원',37.2660,127.0000],cheonan:['천안',36.8100,127.1500],
cheonanasan:['천안아산',36.7948,127.1046],onyang:['온양온천',36.7800,127.0170],yesan:['예산',36.6850,126.8450],
hongseong:['홍성',36.5970,126.6670],daecheon:['대천',36.3320,126.5920],janghang:['장항',36.0230,126.6900],
osong:['오송',36.6203,127.3270],gongju:['공주',36.4733,127.0866],daejeon:['대전',36.3320,127.4340],
gimcheon:['김천구미',36.1280,128.1810],dongdaegu:['동대구',35.8795,128.6283],singyeongju:['신경주',35.7980,129.1390],
gyeongju:['경주',35.8430,129.2170],ulsan:['울산(통도사)',35.5700,129.1360],busan:['부산',35.1150,129.0410],
haeundae:['해운대',35.1790,129.1200],taehwagang:['태화강',35.5370,129.3530],

gwangju:['광주송정',35.1370,126.7930],naju:['나주',35.0170,126.7118],mokpo:['목포',34.7920,126.3870],
namwon:['남원',35.4170,127.3880],suncheon:['순천',34.9440,127.4850],yeosu:['여수엑스포',34.7520,127.7510],
miryang:['밀양',35.4950,128.7400],changwon:['창원중앙',35.2570,128.6980],masan:['마산',35.2200,128.5700],jinju:['진주',35.1620,128.1170],
yangpyeong:['양평',37.4920,127.4870],manjong:['만종',37.3390,127.9430],pyeongchang:['평창',37.5470,128.4240],
jinbu:['진부(오대산)',37.6410,128.5610],gangneung:['강릉',37.7650,128.8990],
wonju:['원주',37.3190,127.9330],jecheon:['제천',37.1350,128.2020],yeongju:['영주',36.8110,128.6130],
andong:['안동',36.5710,128.7180],yeongcheon:['영천',35.9660,128.9440],
gapyeong:['가평',37.8150,127.5090],chuncheon:['춘천',37.8840,127.7170],
pohang:['포항',36.0730,129.3490],yeongdeok:['영덕',36.4150,129.3650],uljin:['울진',36.9900,129.4000],
samcheok:['삼척',37.4410,129.1700],donghae:['동해',37.5000,129.1140]
};

/* v: 구간 평균 속도(km/h), dw: 정차(초), hw: 배차(분) */
var LINES=[
{n:'경부선',s:'부',t:'KTX',c:'#1E5FBF',v:200,dw:90,hw:25,ids:['seoul','gwangmyeong','cheonanasan','osong','daejeon','gimcheon','dongdaegu','singyeongju','ulsan','busan']},
{n:'호남선',s:'호',t:'KTX',c:'#12A06A',v:190,dw:90,hw:40,ids:['yongsan','gwangmyeong','osong','gongju','iksan','jeongeup','gwangju','naju','mokpo']},
{n:'강릉선',s:'강',t:'KTX',c:'#8B5CC8',v:160,dw:90,hw:60,ids:['seoul','cheongnyangni','yangpyeong','manjong','pyeongchang','jinbu','gangneung']},
{n:'전라선',s:'전',t:'KTX',c:'#E8871E',v:170,dw:90,hw:60,ids:['yongsan','gwangmyeong','osong','iksan','jeonju','namwon','suncheon','yeosu']},
{n:'경전선',s:'경',t:'KTX',c:'#C2417A',v:130,dw:90,hw:120,ids:['busan','miryang','changwon','masan','jinju','suncheon']},
{n:'중앙선',s:'중',t:'KTX-이음',c:'#7A8A1E',v:120,dw:100,hw:90,ids:['cheongnyangni','yangpyeong','wonju','jecheon','yeongju','andong','yeongcheon','gyeongju']},
{n:'경춘선',s:'춘',t:'ITX-청춘',c:'#00A3C4',v:100,dw:60,hw:30,ids:['yongsan','cheongnyangni','gapyeong','chuncheon']},
{n:'장항선',s:'장',t:'ITX-새마을',c:'#A8743A',v:100,dw:80,hw:60,ids:['yongsan','suwon','cheonan','onyang','yesan','hongseong','daecheon','janghang','iksan']},
{n:'동해선',s:'동',t:'ITX-마음',c:'#5B6B7A',v:90,dw:80,hw:80,ids:['busan','haeundae','taehwagang','gyeongju','pohang','yeongdeok','uljin','samcheok','donghae','gangneung']}
];

function hav(a,b){ /* km, 선로 굴곡 보정 */
  var R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180;
  var la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180;
  var h=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(h)))*1.15;
}
function bearing(a,b){
  var dx=(b.lng-a.lng)*Math.cos((a.lat+b.lat)/2*Math.PI/180), dy=-(b.lat-a.lat);
  return Math.atan2(dy,dx);
}
function toLL(id){var d=ST[id];return {lat:d[1],lng:d[2],name:d[0]};}
function mkTl(L,ids){
  var q=ids.map(toLL),arr=[0],dep=[0],t=0;
  for(var i=1;i<q.length;i++){
    t=dep[i-1]+hav(q[i-1],q[i])/L.v*3600;
    arr.push(t);dep.push(i===q.length-1?t:t+L.dw);
  }
  return {sts:q,arr:arr,dep:dep,T:t};
}
LINES.forEach(function(L,li){
  var rev=L.ids.slice().reverse();
  L.tl=[mkTl(L,L.ids),mkTl(L,rev)];
  L.deps=[0,1].map(function(d){
    var a=[],t=5.5*3600+li*211+d*337;
    while(t<=22.5*3600){a.push(t);var h=t/3600;t+=L.hw*60*((h<7||h>20.5)?1.6:1);}
    return a;
  });
  L.on=true;
});
function posAt(tl,t){
  var s=tl.sts,arr=tl.arr,dep=tl.dep,n=s.length,i=0;
  while(i<n-1&&arr[i+1]<=t)i++;
  if(i>=n-1){var a0=s[n-2],b0=s[n-1];return{lat:b0.lat,lng:b0.lng,ang:bearing(a0,b0),i:n-1,stop:true,next:n-1,eta:0,dwellLeft:0};}
  var a=s[i],b=s[i+1],ang=bearing(a,b);
  if(t<dep[i])return{lat:a.lat,lng:a.lng,ang:ang,i:i,stop:true,next:i+1,eta:arr[i+1]-t,dwellLeft:dep[i]-t};
  var f=(t-dep[i])/(arr[i+1]-dep[i]); f=f*f*(3-2*f);
  return{lat:a.lat+(b.lat-a.lat)*f,lng:a.lng+(b.lng-a.lng)*f,ang:ang,i:i,stop:false,next:i+1,eta:arr[i+1]-t,dwellLeft:0};
}

function $(s){return document.querySelector(s);}
function pad(n){return (n<10?'0':'')+n;}
function hhmm(sec){sec=Math.floor(sec)%86400;return pad(Math.floor(sec/3600))+':'+pad(Math.floor(sec%3600/60));}
function fmt(s){
  s=Math.max(0,Math.round(s));
  if(s>=3600)return Math.floor(s/3600)+'시간 '+Math.floor(s%3600/60)+'분';
  if(s>=60)return Math.floor(s/60)+'분';
  return s+'초';
}

var map=L.map('map',{zoomControl:true,attributionControl:true,minZoom:6,maxZoom:15});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
map.setView([36.2,127.8],7);

LINES.forEach(function(Ln,li){ Ln.id='l'+li; });

/* 역 마커(여러 노선이 겹치는 역은 한 번만) */
var used={};
LINES.forEach(function(Ln){Ln.ids.forEach(function(id){used[id]=(used[id]||0)+1;});});
var curPopup=null;
Object.keys(used).forEach(function(id){
  var d=ST[id],major=used[id]>1;
  var cm=L.circleMarker([d[1],d[2]],{radius:major?5:3.4,color:'#12202B',weight:major?1.6:1,fillColor:'#fff',fillOpacity:1,opacity:1}).addTo(map);
  cm.on('click',function(){
    var lines=LINES.filter(function(x){return x.ids.indexOf(id)>=0;});
    var html='<div class="st-pop"><b>'+d[0]+'</b>'+lines.map(function(x){return '<span class="ln" style="background:'+x.c+'">'+x.n+'</span>';}).join('')+'</div>';
    if(curPopup)map.closePopup(curPopup);
    curPopup=L.popup({closeButton:true}).setLatLng([d[1],d[2]]).setContent(html).openOn(map);
  });
});

/* 노선 폴리라인 */
LINES.forEach(function(Ln){
  var latlngs=Ln.ids.map(function(id){var d=ST[id];return [d[1],d[2]];});
  var pl=L.polyline(latlngs,{color:Ln.c,weight:3.5,opacity:.85,lineJoin:'round',lineCap:'round'});
  pl.addTo(map);
  pl.bringToBack();
  Ln.poly=pl;
});

/* ---------- 열차 아이콘(SVG, 실제 기차 모양) ---------- */
function trainSvg(Ln){
  return '<svg width="30" height="30" viewBox="-15 -15 30 30" xmlns="http://www.w3.org/2000/svg">'+
    '<circle class="ring" r="13" fill="none" stroke="var(--ink)" stroke-width="2" opacity="0"/>'+
    '<g class="rot">'+
      '<path d="M-9.5,-4.4 L3,-4.4 Q9.6,-4.4 11.2,0 Q9.6,4.4 3,4.4 L-9.5,4.4 Z" fill="'+Ln.c+'" stroke="var(--land)" stroke-width="1" stroke-linejoin="round"/>'+
      '<rect x="-7" y="-2.6" width="2.8" height="5.2" rx="1" fill="#fff" opacity=".55"/>'+
      '<rect x="-2.6" y="-2.6" width="2.8" height="5.2" rx="1" fill="#fff" opacity=".4"/>'+
      '<circle cx="6" cy="0" r="1.3" fill="#fff" opacity=".9"/>'+
    '</g>'+
    '<circle r="6.6" fill="'+Ln.c+'" stroke="var(--land)" stroke-width="1.4"/>'+
    '<text x="0" y="3.3" text-anchor="middle" fill="#fff" style="font:700 9px var(--f-body);pointer-events:none">'+Ln.s+'</text>'+
  '</svg>';
}
var trains=new Map(),sel=null,sheetKey='',lastUI=0,total=0,follow=false;
function makeTrain(Ln,d,dep,key){
  var divIcon=L.divIcon({className:'tricon',html:trainSvg(Ln),iconSize:[30,30],iconAnchor:[15,15]});
  var marker=L.marker([0,0],{icon:divIcon,interactive:true,keyboard:false}).addTo(map);
  marker.on('click',function(){select(key);});
  var r={marker:marker,L:Ln,d:d,dep:dep,p:null};
  trains.set(key,r);return r;
}
function setTrainPos(r,lat,lng,angDeg){
  r.marker.setLatLng([lat,lng]);
  var el=r.marker.getElement();
  if(el){var rot=el.querySelector('.rot'); if(rot)rot.setAttribute('transform','rotate('+angDeg.toFixed(1)+')');}
}
function select(key){
  if(sel&&trains.has(sel)){var pe=trains.get(sel).marker.getElement();if(pe)pe.classList.remove('sel');}
  sel=key;follow=false;sheetKey='';
  if(sel&&trains.has(sel)){var r=trains.get(sel);var el=r.marker.getElement();if(el)el.classList.add('sel');}
  else sel=null;
}

var sheet=$('#sheet');
function buildSheet(){
  var key=sel?'s:'+sel+':'+follow:'idle';
  if(key===sheetKey)return;sheetKey=key;
  if(sel&&trains.has(sel)){
    var r=trains.get(sel),Ln=r.L,tl=Ln.tl[r.d];
    var dest=tl.sts[tl.sts.length-1].name+'행';
    sheet.innerHTML='<div class="who"><span class="dot" style="background:'+Ln.c+'">'+Ln.s+'</span><div><strong>'+Ln.t+' · '+Ln.n+' '+dest+'</strong><span class="s" id="shSub"></span></div></div>'+
      '<div class="acts"><button type="button" class="btn" data-act="follow" aria-pressed="'+follow+'">'+(follow?'따라가는 중':'따라가기')+'</button><button type="button" class="btn" data-act="close">닫기</button></div>';
  }else{
    sheet.innerHTML='<div class="who"><div><strong id="shMain">운행 중 0대</strong><span class="s" id="shSub">열차를 눌러 다음 역과 도착 시간을 확인하세요</span></div></div>';
  }
}
sheet.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.act==='close')select(null);
  if(b.dataset.act==='follow'){follow=!follow;sheetKey='';}
});
function updateSheet(){
  buildSheet();
  var sub=$('#shSub');if(!sub)return;
  if(sel&&trains.has(sel)){
    var r=trains.get(sel),p=r.p;if(!p)return;
    var tl=r.L.tl[r.d];
    sub.textContent=(p.stop?tl.sts[p.i].name+' 정차 중':'다음 '+tl.sts[p.next].name+' · '+fmt(p.eta)+' 후 도착')+' · '+hhmm(r.dep)+' 출발';
  }else{
    var m=$('#shMain');
    if(total>0){m.textContent='운행 중 '+total+'대';sub.textContent='열차를 눌러 다음 역과 도착 시간을 확인하세요';}
    else{m.textContent='지금은 운행 시간이 아니에요';sub.textContent='첫차 05:30 기준 · ×300 배속으로 낮 시간을 볼 수 있어요';}
  }
}

/* ---------- 시계 ---------- */
var scale=60,simBase=Date.now(),realBase=Date.now();
function simNow(){return simBase+(Date.now()-realBase)*scale;}
function svcSec(ms){
  var d=new Date(ms+9*3600000),sod=d.getUTCHours()*3600+d.getUTCMinutes()*60+d.getUTCSeconds()+d.getUTCMilliseconds()/1000;
  return sod<4*3600?sod+86400:sod;
}
function setScale(n){
  simBase=simNow();realBase=Date.now();scale=n;
  document.querySelectorAll('.seg button').forEach(function(b){b.setAttribute('aria-pressed',String(+b.dataset.s===n));});
}
document.querySelectorAll('.seg button').forEach(function(b){b.addEventListener('click',function(){setScale(+b.dataset.s);});});
$('#now').addEventListener('click',function(){simBase=Date.now();realBase=Date.now();});

/* ---------- 노선 칩 ---------- */
var chips=$('#chips');
var allBtn=document.createElement('button');
allBtn.type='button';allBtn.className='chip all';allBtn.textContent='전체';
allBtn.addEventListener('click',function(){LINES.forEach(function(L){L.on=true;});syncChips();});
chips.appendChild(allBtn);
LINES.forEach(function(Ln,i){
  var b=document.createElement('button');
  b.type='button';b.className='chip';b.setAttribute('aria-label',Ln.n+' 표시 전환');
  b.innerHTML='<span class="d" style="background:'+Ln.c+'">'+Ln.s+'</span><span class="nm">'+Ln.n+'</span><span class="c" id="cnt'+i+'">0</span>';
  b.addEventListener('click',function(){Ln.on=!Ln.on;syncChips();});
  Ln.chip=b;chips.appendChild(b);
});
function syncChips(){
  LINES.forEach(function(Ln){
    Ln.chip.setAttribute('aria-pressed',String(Ln.on));
    Ln.poly.setStyle({opacity:Ln.on?.85:0});
    trains.forEach(function(r){if(r.L===Ln){var el=r.marker.getElement();if(el)el.style.display=Ln.on?'':'none';}});
  });
}
syncChips();
try{
  var bounds=Object.keys(used).map(function(id){var d=ST[id];return [d[1],d[2]];});
  if(bounds.length)map.fitBounds(bounds,{padding:[18,18]});
}catch(e){}

var lastClk='';
function frame(ts){
  var now=simNow(),sd=svcSec(now);
  var seen=new Set(),cnt=[],tot=0;
  LINES.forEach(function(Ln,li){
    var c=0;
    for(var d=0;d<2;d++){
      var arr=Ln.deps[d],T=Ln.tl[d].T;
      for(var j=0;j<arr.length;j++){
        var dep=arr[j];if(dep>sd)break;
        var t=sd-dep;if(t>=T)continue;
        c++;
        if(!Ln.on)continue;
        var key=li+'-'+d+'-'+j,r=trains.get(key)||makeTrain(Ln,d,dep,key);
        seen.add(key);
        var p=posAt(Ln.tl[d],t);r.p=p;
        setTrainPos(r,p.lat,p.lng,p.ang*180/Math.PI);
      }
    }
    cnt[li]=c;tot+=c;
  });
  total=tot;
  trains.forEach(function(r,key){
    if(!seen.has(key)){map.removeLayer(r.marker);trains.delete(key);if(sel===key){sel=null;follow=false;sheetKey='';}}
  });
  if(follow&&sel&&trains.has(sel)){
    map.panTo(trains.get(sel).marker.getLatLng(),{animate:false});
  }
  var dt=new Date(now+9*3600000),cl=pad(dt.getUTCHours())+':'+pad(dt.getUTCMinutes())+':'+pad(dt.getUTCSeconds());
  if(cl!==lastClk){lastClk=cl;$('#clk').textContent=cl;$('#clkNote').textContent='KST · '+(scale===1?'실시간 속도':'×'+scale+' 배속');}
  if(ts-lastUI>250){
    lastUI=ts;
    LINES.forEach(function(Ln,li){var e=$('#cnt'+li);if(e)e.textContent=cnt[li];});
    updateSheet();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
