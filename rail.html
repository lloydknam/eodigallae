<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F4F6">
<title>열차정보 | 어디갈래</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{--paper:#F2F4F6;--surface:#fff;--ink:#191F28;--muted:#6B7684;--line:#E5E8EB;--green:#12907A;--soft:#DFF2EB;--display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
header{height:58px;background:#fff;display:flex;align-items:center;padding:0 max(16px,calc((100% - 980px)/2));border-bottom:1px solid var(--line)}
header a{color:var(--green);text-decoration:none;font:26px var(--display)}
main{max-width:980px;margin:auto;padding:22px 14px 48px}.kicker{font-size:11px;font-weight:700;letter-spacing:.13em;color:var(--green)}
h1{font:36px/1.2 var(--display);font-weight:400;margin:4px 0}.lead{margin:0;color:var(--muted);font-size:14px}
.switch{display:flex;gap:8px;margin:20px 0 12px}.switch button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:13px;padding:11px 17px;font:600 14px var(--body);cursor:pointer}.switch button.active{background:var(--green);border-color:var(--green);color:white}
.panel{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 2px 10px #172b2410}
.panel iframe{display:block;width:100%;height:min(84vh,780px);min-height:560px;border:0;background:#E7EDF1}
.notice{margin-top:12px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:14px;color:var(--muted);font-size:12px}.back{display:inline-flex;margin-top:20px;color:var(--green);font-weight:700;text-decoration:none}
@media(max-width:620px){main{padding:19px 12px 36px}h1{font-size:33px}}
</style>
</head>
<body>
<header><a href="./">어디갈래</a></header>
<main>
<div class="kicker">TRAIN & TRANSIT</div><h1>열차정보</h1>
<p class="lead">전국 철도와 수도권 지하철 위를 달리는 열차를 지도에서 살펴보세요.</p>
<div class="switch" role="tablist" aria-label="교통수단 선택">
<button id="metroBtn" class="active" type="button" role="tab" aria-selected="true">🚇 수도권 지하철</button>
<button id="nationalBtn" type="button" role="tab" aria-selected="false">🚄 전국 철도</button>
</div>
<section class="panel" id="metroPanel"><iframe id="metroFrame" title="수도권 지하철 열차지도" src="subway-map.html?embed=1"></iframe></section>
<section class="panel" id="natPanel" hidden><iframe id="natFrame" title="전국 철도 열차지도" data-src="rail-map.html?embed=1"></iframe></section>
<div class="notice" id="notice">열차 위치는 시간표를 흉내 낸 모의 운행이며 실제 위치가 아닙니다(지하철 지도의 "실시간" 버튼을 켜면 서울시 실시간 위치로 바뀝니다). 노선도는 주요 역만 이은 약식 지도입니다. 실제 운행·시간표는 코레일 및 각 운영기관의 공지를 확인하세요.</div>
<a class="back" href="./">← 어디갈래 홈으로</a>
</main>
<script>
function showTab(type){
  const metroOn=type==='metro';
  document.getElementById('nationalBtn').classList.toggle('active',!metroOn);
  document.getElementById('metroBtn').classList.toggle('active',metroOn);
  document.getElementById('nationalBtn').setAttribute('aria-selected',String(!metroOn));
  document.getElementById('metroBtn').setAttribute('aria-selected',String(metroOn));
  document.getElementById('natPanel').hidden=metroOn;
  document.getElementById('metroPanel').hidden=!metroOn;
  if(!metroOn){const f=document.getElementById('natFrame');if(!f.getAttribute('src'))f.src=f.dataset.src}
  try{history.replaceState(null,'',metroOn?location.pathname+location.search:'#rail')}catch(e){}
}
document.getElementById('nationalBtn').addEventListener('click',()=>showTab('rail'));
document.getElementById('metroBtn').addEventListener('click',()=>showTab('metro'));
if(location.hash==='#rail')showTab('rail');
</script>
</body></html>
