<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>열차지도 | 어디갈래</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#E9EEF2; --land:#F6F8FA; --panel:#FFFFFF; --ink:#12202B; --muted:#586977; --rule:#CFD8DF; --water:#C6DEEE; --signal:#E4372B;
  --f-display:'SUIT','Apple SD Gothic Neo','Malgun Gothic',sans-serif; --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0B1218;--land:#0F1A22;--panel:#16222C;--ink:#E7EEF3;--muted:#93A4B1;--rule:#25323D;--water:#123049;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0B1218;--land:#0F1A22;--panel:#16222C;--ink:#E7EEF3;--muted:#93A4B1;--rule:#25323D;--water:#123049;color-scheme:dark}
html{box-sizing:border-box;height:100%}
body{box-sizing:border-box;height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;
  display:flex;flex-direction:column;gap:10px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex:none}
.top h1{margin:0;font-family:var(--f-display);font-weight: 700;font-size:23px;letter-spacing:-.01em}
.sub{margin:2px 0 0;color:var(--muted);font-size:12px}
.clock{text-align:right;flex:none}
.clock b{display:block;font: 700 30px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock small{color:var(--muted);font-size:11px}

.ctl{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font:600 14px var(--f-body);letter-spacing:.01em;min-width:44px}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{border:1px solid var(--rule);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
#liveBtn[aria-pressed="true"]{background:var(--signal);border-color:var(--signal);color:#fff}
.seg button:disabled{opacity:.4;cursor:default}

.chips{display:flex;gap:6px;overflow-x:auto;flex:none;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:3px 10px 3px 3px;cursor:pointer;min-height:30px}
.chip .d{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 11px var(--f-body);white-space:nowrap}
.chip .nm{font:500 13px var(--f-body);color:var(--ink);white-space:nowrap;max-width:94px;overflow:hidden;text-overflow:ellipsis}
.chip .c{font:500 13px var(--f-body);font-variant-numeric:tabular-nums;color:var(--muted);min-width:1.1em;text-align:right}
.chip.all{padding:3px 12px;font-size:13px}
.chip[aria-pressed="false"]{opacity:.4}

.map{position:relative;flex:1;min-height:0;border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--land)}
#map{position:absolute;inset:0;width:100%;height:100%}
.leaflet-tile-pane{filter:brightness(1.03)}
:root:not([data-theme="light"]) .leaflet-tile-pane,:root[data-theme="dark"] .leaflet-tile-pane{filter:brightness(.92)}
.leaflet-control-attribution{font-size:10px}
.st-dot{border-radius:50%;background:var(--panel);box-sizing:border-box}
.st-pop{font:500 13px var(--f-body)}
.st-pop b{display:block;font-size:14px;margin-bottom:2px}
.st-pop .ln{display:inline-block;margin:2px 3px 0 0;padding:1px 7px;border-radius:999px;font:700 11px var(--f-body)}
.tricon{pointer-events:auto;cursor:pointer}
.tricon .body{transition:none}
.tricon.sel .ring{opacity:1!important}

.sheet{flex:none;background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who .dot{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--f-body);text-align:center;line-height:1.05}
.who strong{display:block;font-size:15px}
.who span.s{display:block;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:6px;flex:none}
.acts .btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.credit{flex:none;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;color:var(--muted);font-size:11px}
.back{color:var(--muted);font-size:12px;text-decoration:none;display:inline-block;margin-bottom:2px}
.back:hover{color:var(--ink)}
.maker{flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px;color:var(--muted);font-size:11px}
.maker img{height:22px;display:block}
body{padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
html.embed .top>div:first-child,html.embed .maker{display:none}
html.embed .top{justify-content:flex-end}
html.embed body{padding-top:8px;padding-bottom:8px}

/* 역 도착정보 화면(역명 클릭) */
.arr{position:fixed;inset:0;z-index:2000;display:none;background:#0A1119;color:#EEF3F7;overflow-y:auto;font-family:var(--f-body);-webkit-overflow-scrolling:touch}
.arr.open{display:block}
.arr-in{max-width:620px;margin:0 auto;padding:max(16px,env(safe-area-inset-top,0px)) 18px max(28px,env(safe-area-inset-bottom,0px))}
.arr-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:1px solid #1E2C38}
.arr-title{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.arr-title .sn{font:700 22px/1.2 var(--f-display);white-space:nowrap;margin-right:4px}
.arr-title .sep{width:1px;height:18px;background:#2A3A47;margin:0 4px}
.arr-x{flex:none;border:1px solid #2A3A47;background:transparent;color:#EEF3F7;border-radius:999px;width:36px;height:36px;cursor:pointer;font-size:14px}
.badge{flex:none;min-width:28px;height:28px;padding:0 6px;border-radius:999px;display:inline-grid;place-items:center;font:700 12px var(--f-body);box-sizing:border-box}
.hero{margin-top:20px}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid #1E6FA8;border-radius:999px;padding:4px 12px;color:#5DB8F2;font-size:13px}
.pill i{width:7px;height:7px;border-radius:50%;background:#2F9BE8;box-shadow:0 0 0 3px rgba(47,155,232,.25)}
.hero-main{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:16px}
.dhero{margin-top:18px;padding-top:16px;border-top:1px solid #1E2C38}
.dhero:first-child{margin-top:14px;border-top:0;padding-top:0}
.dtag-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dtag{font:800 13px var(--f-body);color:#EEF3F7;background:#1B2935;border-radius:6px;padding:3px 9px}
.dhero .hero-dest{font-size:clamp(34px,10vw,52px)}
.dhero .hero-main{margin-top:4px}
.dhero .hero-lbl{line-height:1.2;margin-bottom:-.5vw}
.dhero .hero-cd{font-size:clamp(40px,11vw,72px);white-space:nowrap}
.hero-dest{font:800 clamp(40px,12vw,64px)/1.05 var(--f-display);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hero-cd{flex:none;text-align:right;font:800 clamp(60px,18vw,96px)/.95 var(--f-display);font-variant-numeric:tabular-nums}
.hero-cd .cd-word{font-size:.62em;letter-spacing:-.02em}
.hero-cd small{font-size:24px;color:#3AA6F0;margin-left:4px;margin-right:6px;font-weight:700}
.hero-cd small:last-child{margin-right:0}
.hero-lbl{color:#7E8F9C;font-size:12px;text-align:right;margin-bottom:2px}
.hero-sub{color:#7E8F9C;font-size:13px;margin-top:8px}
.hero-row{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 12px;margin-top:6px}
.hero-row .hero-sub{margin-top:0}
.hero-next{color:#B7C4CE;font-size:13px;margin-left:auto;text-align:right}
.hero-next b{color:#EEF3F7;font-weight:700}
.lines-h{margin:26px 0 8px;color:#7E8F9C;font-size:12px;letter-spacing:.06em}
.ln-block{border:1px solid #1E2C38;border-radius:12px;padding:10px 12px;margin-bottom:10px;background:#101A23}
.ln-head{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:2px}
.dir{color:#7E8F9C;font-size:12px;margin:10px 0 2px}
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #1B2935;font-size:14px}
.trow:first-of-type{border-top:0}
.trow .d{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .m{color:#93A4B1;font-size:12px;flex:none}
.trow .c{flex:none;min-width:84px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.arr-foot{margin-top:18px;color:#7E8F9C;font-size:12px;line-height:1.6}
.arr-empty{padding:48px 0;text-align:center;color:#93A4B1;line-height:1.7}

/* 노선 탭 · 상하행 두 열 · 칸별 혼잡도 */
.ltabs{display:flex;gap:6px;overflow-x:auto;margin:16px 0 12px;scrollbar-width:none}
.ltabs::-webkit-scrollbar{display:none}
.ltab{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid #2A3A47;background:transparent;color:#EEF3F7;border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;font-size:13px}
.ltab[aria-pressed="true"]{background:#EEF3F7;color:#0A1119;border-color:#EEF3F7}
.ltab[aria-pressed="true"] .badge{box-shadow:0 0 0 2px #0A1119}
.ltab .badge{min-width:24px;height:24px;padding:0 5px;font-size:11px}
.dircols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dcol{border:1px solid #1E2C38;border-radius:12px;padding:10px;background:#101A23;min-width:0}
.dhead{font-weight:700;font-size:13px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dhead small{display:block;color:#7E8F9C;font-weight:500;font-size:12px;margin-top:2px}
.tr{padding:8px 0;border-top:1px solid #1B2935}
.tr:first-of-type{border-top:0}
.tr .cd{font-weight:800;font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tr .mg{color:#93A4B1;font-size:12px;margin-top:2px}
.dnone{color:#7E8F9C;font-size:13px;padding:14px 0}
.cars{margin-top:10px;border-top:1px solid #1B2935;padding-top:8px}
.cars-h{color:#7E8F9C;font-size:11px;margin-bottom:6px}
.carrow{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
.car{border-radius:4px;height:28px;display:grid;place-items:center;font-size:9px;font-weight:700;color:#0A1119}
.car.l{background:#3DDC97}.car.m{background:#F5C542}.car.h{background:#F0524B}
.cars-legend{display:flex;gap:10px;margin-top:6px;color:#93A4B1;font-size:11px}
.cars-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
.route{position:relative;height:80px;margin:12px 0 2px}
.rwrap{position:absolute;left:34px;right:34px;top:0;bottom:0}
.rline{position:absolute;left:0;right:0;top:42px;height:4px;border-radius:2px;opacity:.9}
.rnode{position:absolute;top:38px;transform:translateX(-50%);width:70px;text-align:center}
.rnode i{display:block;width:12px;height:12px;border-radius:50%;background:#0A1119;border:2px solid #EEF3F7;margin:0 auto;box-sizing:border-box}
.rnode.cur i{width:16px;height:16px;border-color:#3AA6F0;box-shadow:0 0 0 4px rgba(58,166,240,.25)}
.rnode span{display:block;margin-top:7px;font-size:10px;color:#93A4B1;white-space:nowrap}
.rnode.cur span{color:#EEF3F7;font-weight:700}
.rtrain{position:absolute;top:0;transform:translateX(-50%);width:64px;text-align:center}
.rtrain svg{display:block;margin:0 auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.45))}
.rcap{margin-top:2px;font-size:10px;font-weight:700;color:#EEF3F7;white-space:nowrap}
@media (max-width:360px){.trow .c{min-width:70px}.tr .cd{font-size:17px}}
</style>

<header class="top">
  <div>
    <a class="back" href="rail.html">← 열차정보</a>
    <h1>열차지도</h1>

  </div>
  <div class="clock"><b id="clk">--:--:--</b><small id="clkNote">KST</small></div>
</header>

<div class="ctl">
  <div class="seg" role="group" aria-label="재생 속도">
    <button type="button" data-s="1" aria-pressed="false">×1</button>
    <button type="button" data-s="10" aria-pressed="true">×10</button>
    <button type="button" data-s="60" aria-pressed="false">×60</button>
  </div>
  <div style="display:flex;gap:6px"><button type="button" class="btn" id="now">현재 시각으로</button><button type="button" class="btn" id="liveBtn" aria-pressed="false">실시간</button></div>
</div>

  <div id="map" role="img" aria-label="수도권 지하철·광역철도·경전철 전체 역과 운행 중인 열차 지도"></div>
</main>

<footer class="maker"><a class="lab" href="https://lloydknam.github.io/showcase/" target="_blank" rel="noopener" title="Lloyd’s Balcony Lab 프로젝트 모음"><img src="icons/brand/lockup-light.svg" alt="Lloyd's Balcony Lab · with claude · GitHub(@lloydknam)"></a></footer>

<div class="arr" id="arr" role="dialog" aria-modal="true" aria-label="역 도착 정보">
  <div class="arr-in">
    <header class="arr-top">
      <div class="arr-title" id="arrTitle"></div>
      <button type="button" class="arr-x" id="arrClose" aria-label="닫기">✕</button>
    </header>
    <div id="arrBody"><div class="arr-empty">불러오는 중…</div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
'use strict';
/* 실시간 중계 서버(Cloudflare Worker) 주소. 비워 두면 '실시간' 버튼이 꺼져 있어요. */
var WORKER='https://eodigallae.lloydnam.workers.dev';
var API=(new URLSearchParams(location.search).get('api')||WORKER).replace(/\/$/,'');
/* 중계 서버가 없으면 GitHub Actions가 30초마다 올리는 스냅샷을 읽는다 */
var SNAP='https://raw.githubusercontent.com/lloydknam/eodigallae/live-data/subway.json';
function liveUrl(){return API?API+'/subway':SNAP+'?t='+Date.now();}

var SPEED_KMH=42, DWELL=25; /* 모의 운행 속도·역당 정차 시간 */

function hav(a,b){ /* km */
  var R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180;
  var la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180;
  var h=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));
}
function bearing(a,b){
  var dx=(b.lng-a.lng)*Math.cos((a.lat+b.lat)/2*Math.PI/180), dy=-(b.lat-a.lat);
  return Math.atan2(dy,dx);
}
function mkTl(sts){
  var arr=[0],dep=[0],t=0;
  for(var i=1;i<sts.length;i++){
    var d=hav(sts[i-1],sts[i]); t=dep[i-1]+d*(3600/SPEED_KMH);
    arr.push(t); dep.push(i===sts.length-1?t:t+DWELL);
  }
  return {sts:sts,arr:arr,dep:dep,T:t};
}
function hw(sec){var h=sec/3600; return h<7?8:h<9.5?4:h<16.5?6.5:h<20?4:h<23?6.5:10;}
function posAt(tl,t){
  var s=tl.sts,arr=tl.arr,dep=tl.dep,n=s.length,i=0;
  while(i<n-1&&arr[i+1]<=t)i++;
  if(i>=n-1){var a0=s[n-2],b0=s[n-1];return{lat:b0.lat,lng:b0.lng,ang:bearing(a0,b0),i:n-1,stop:true,next:n-1,eta:0,dwellLeft:0};}
  var a=s[i],b=s[i+1],ang=bearing(a,b);
  if(t<dep[i])return{lat:a.lat,lng:a.lng,ang:ang,i:i,stop:true,next:i+1,eta:arr[i+1]-t,dwellLeft:dep[i]-t};
  var f=(t-dep[i])/(arr[i+1]-dep[i]); f=f*f*(3-2*f);
  return{lat:a.lat+(b.lat-a.lat)*f,lng:a.lng+(b.lng-a.lng)*f,ang:ang,i:i,stop:false,next:i+1,eta:arr[i+1]-t,dwellLeft:0};
}

function $(s){return document.querySelector(s);}
function pad(n){return (n<10?'0':'')+n;}
function hhmm(sec){sec=Math.floor(sec)%86400;return pad(Math.floor(sec/3600))+':'+pad(Math.floor(sec%3600/60));}
function fmt(s){s=Math.max(0,Math.round(s));var m=Math.floor(s/60),r=s%60;return m?m+'분 '+r+'초':r+'초';}

var map=L.map('map',{zoomControl:true,attributionControl:true,minZoom:9,maxZoom:17});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
map.setView([37.56,126.98],11);

var LINES=[], chips=$('#chips'), trains=new Map(), sel=null, sheetKey='', lastUI=0, total=0, follow=false, curPopup=null;
var allBtn=document.createElement('button');
allBtn.type='button';allBtn.className='chip all';allBtn.textContent='전체';
chips.appendChild(allBtn);

fetch('scripts/data/subway_lines.json').then(function(r){return r.json();}).then(function(data){
  LINES=data.filter(function(g){return g.branches&&g.branches.some(function(b){return b.length>=2;});});
  LINES.forEach(function(G){
    G.on=true;
    G.stations=[].concat.apply([],G.branches); /* 매칭·팝업용 평탄화 목록 */
  });
  init();
}).catch(function(e){
  $('#sheet').innerHTML='<div class="who"><div><strong>노선 데이터를 불러오지 못했어요</strong><span class="s">잠시 뒤 새로고침해 주세요</span></div></div>';
  console.error(e);
});

function mkIcon(G,st){
  var major=/환승/.test(st.xfer||'');
  return L.circleMarker([st.lat,st.lng],{radius:major?8:6,color:'#12202B',weight:major?2.2:1.8,fillColor:'#fff',fillOpacity:1,opacity:1,bubblingMouseEvents:false});
}

function init(){
  var allPts=[];
  LINES.forEach(function(G,gi){
    G.runs=G.branches.filter(function(b){return b.length>=2;}).map(function(sts,bi){
      var tl=[mkTl(sts),mkTl(sts.slice().reverse())];
      var deps=[0,1].map(function(d){
        var a=[],t=5.5*3600+gi*47+bi*23+d*131;

function routeStrip(lineId,it,st,peers){

  });

}
function makeTrain(G,run,d,dep,key){
  var divIcon=L.divIcon({className:'tricon',html:trainSvg(G),iconSize:[40,40],iconAnchor:[20,20]});
  var marker=L.marker([0,0],{icon:divIcon,interactive:true,keyboard:false}).addTo(map);
  marker.on('click',function(){select(key);});
  var r={marker:marker,G:G,run:run,d:d,dep:dep,p:null};
  trains.set(key,r);return r;
}
function setTrainPos(r,lat,lng,angDeg){
  r.marker.setLatLng([lat,lng]);
  var el=r.marker.getElement();
  if(el){var rot=el.querySelector('.rot'); if(rot)rot.setAttribute('transform','rotate('+angDeg.toFixed(1)+')');}
}
function select(key){
  if(sel&&trains.has(sel)){var pe=trains.get(sel).marker.getElement();if(pe)pe.classList.remove('sel');}
  sel=key;follow=false;sheetKey='';
  if(sel&&trains.has(sel)){var r=trains.get(sel);var el=r.marker.getElement();if(el)el.classList.add('sel');}
  else sel=null;
}

var sheet=$('#sheet');
function buildSheet(){
  var key=sel?'s:'+sel+':'+follow:'idle';
  if(key===sheetKey)return;sheetKey=key;
  if(sel&&trains.has(sel)){
    var r=trains.get(sel),G=r.G,tl=r.live?null:r.run.tl[r.d];
    var dest=r.live?(r.live.d||'')+'행':tl.sts[tl.sts.length-1].name+'행';
    sheet.innerHTML='<div class="who"><span class="dot" style="background:'+G.color+';color:'+G.textColor+'">'+G.name+'</span><div><strong>'+dest+'</strong><span class="s" id="shSub"></span></div></div>'+
      '<div class="acts"><button type="button" class="btn" data-act="follow" aria-pressed="'+follow+'">'+(follow?'따라가는 중':'따라가기')+'</button><button type="button" class="btn" data-act="close">닫기</button></div>';
  }else{
    sheet.innerHTML='<div class="who"><div><strong id="shMain">운행 중 0대</strong><span class="s" id="shSub">열차를 눌러 다음 역과 도착 시간을 확인하세요</span></div></div>';
  }
}
sheet.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.act==='close')select(null);
  if(b.dataset.act==='follow'){follow=!follow;sheetKey='';}
});
function updateSheet(){
  buildSheet();
  var sub=$('#shSub');if(!sub)return;
  if(sel&&trains.has(sel)){
    var r=trains.get(sel),p=r.p;
    if(r.live){sub.textContent=r.live.s+' '+(STT[r.live.st]||'')+' · 실시간'+(liveErr?' ('+liveErr+')':'');return;}
    if(!p)return;
    var tl=r.run.tl[r.d];
    sub.textContent=(p.stop?tl.sts[p.i].name+' 정차 중 · '+Math.ceil(p.dwellLeft)+'초 후 출발':'다음 '+tl.sts[p.next].name+' · '+fmt(p.eta)+' 후 도착')+' · '+hhmm(r.dep)+' 출발';
  }else{
    var m=$('#shMain');
    if(live){m.textContent=liveErr||('실시간 운행 중 '+total+'대');sub.textContent=liveErr?'15초마다 다시 시도해요':'1~9호선은 실시간, 그 밖의 노선은 모의 운행이에요 · 매칭 안 된 열차 '+unmapped+'대';return;}
    if(total>0){m.textContent='운행 중 '+total+'대';sub.textContent='열차를 눌러 다음 역과 도착 시간을 확인하세요';}
    else{m.textContent='지금은 운행 시간이 아니에요';sub.textContent='첫차 05:30 · 막차 24:30 기준';}
  }
}

/* ---------- 시계 ---------- */
var scale=10,simBase=Date.now(),realBase=Date.now();
function simNow(){return simBase+(Date.now()-realBase)*scale;}
function svcSec(ms){
  var d=new Date(ms+9*3600000),sod=d.getUTCHours()*3600+d.getUTCMinutes()*60+d.getUTCSeconds()+d.getUTCMilliseconds()/1000;
  return sod<4*3600?sod+86400:sod;
}
function setScale(n){
  simBase=simNow();realBase=Date.now();scale=n;
  document.querySelectorAll('.seg button').forEach(function(b){b.setAttribute('aria-pressed',String(+b.dataset.s===n));});
}
document.querySelectorAll('.seg button').forEach(function(b){b.addEventListener('click',function(){setScale(+b.dataset.s);});});
$('#now').addEventListener('click',function(){simBase=Date.now();realBase=Date.now();});

/* ---------- 실시간 모드(1~9호선) ---------- */
var live=false,liveTrains=new Map(),liveErr='',unmapped=0,pollT=0,prevScale=10;
var ALIAS={'총신대입구':'이수'};
function nm(s){s=String(s||'').replace(/\(.*?\)/g,'').replace(/\s/g,'').replace(/역$/,'');return ALIAS[s]||s;}
var liveIdx={};
var STT=['진입','도착','출발','전역 출발'];
function buildLiveIdx(){
  liveIdx={};
  LINES.forEach(function(G){
    if(!G.liveNum)return;
    G.nameIdx={};
    G.stations.forEach(function(s,i){G.nameIdx[nm(s.name)]=i;});
    liveIdx[G.liveNum]=G;
  });
}
function pollLive(){
  if(!live)return;
  fetch(liveUrl(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){
    if(j.error)throw 0;
    var at=j.at||0;
    if(at&&Date.now()-at>300000){liveErr='데이터가 '+Math.round((Date.now()-at)/60000)+'분 전 것이에요';}
    var now=performance.now(),un=0;
    (j.trains||[]).forEach(function(it){
      var G=liveIdx[it.l];if(!G)return;
      var key='live-'+it.l+'-'+it.t,lt=liveTrains.get(key),i=G.nameIdx[nm(it.s)];
      if(i===undefined){un++;if(lt)lt.seen=now;return;}
      var st=G.stations[i];
      if(!lt){lt={G:G,lat:st.lat,lng:st.lng,tlat:st.lat,tlng:st.lng,ang:0};liveTrains.set(key,lt);}
      else if(lt.tlat!==st.lat||lt.tlng!==st.lng){lt.ang=bearing({lat:lt.tlat,lng:lt.tlng},st);lt.tlat=st.lat;lt.tlng=st.lng;}
      lt.seen=now;lt.s=it.s;lt.d=it.d;lt.st=it.st;
    });
    unmapped=un;if(!(at&&Date.now()-at>300000))liveErr='';
  }).catch(function(){liveErr='실시간 데이터를 불러오지 못했어요';});
}
function makeLive(lt,key){var r=makeTrain(lt.G,null,0,0,key);r.live=lt;return r;}
function liveFrame(seen,cnt){
  var tot=0,now=performance.now();
  liveTrains.forEach(function(lt,key){
    if(now-lt.seen>60000){liveTrains.delete(key);var old=trains.get(key);if(old){map.removeLayer(old.marker);trains.delete(key);}return;}
    cnt[lt.G.id]=(cnt[lt.G.id]||0)+1;tot++;
    if(!lt.G.on)return;
    lt.lat+=(lt.tlat-lt.lat)*.25;lt.lng+=(lt.tlng-lt.lng)*.25;
    var r=trains.get(key)||makeLive(lt,key);
    seen.add(key);r.p=null;
    setTrainPos(r,lt.lat,lt.lng,lt.ang*180/Math.PI);
  });
  return tot;
}
var liveBtn=$('#liveBtn');
liveBtn.disabled=true;liveBtn.textContent='실시간 준비 중';liveBtn.title='실시간 열차 위치가 아직 연결되지 않았어요';
fetch(liveUrl(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){
  if(j&&!j.error&&j.at&&Date.now()-j.at<300000&&(j.trains||[]).length>0){liveBtn.disabled=false;liveBtn.textContent='실시간';liveBtn.title='';}
}).catch(function(){});
function setLive(on){
  if(on===live)return;
  live=on;
  trains.forEach(function(r){map.removeLayer(r.marker);});trains.clear();liveTrains.clear();select(null);
  document.querySelectorAll('.seg button').forEach(function(b){b.disabled=on;});
  liveBtn.setAttribute('aria-pressed',String(on));
  clearInterval(pollT);
  if(on){prevScale=scale;liveErr='';pollLive();pollT=setInterval(pollLive,15000);}
  sheetKey='';lastClk='';
}
liveBtn.addEventListener('click',function(){if(!liveBtn.disabled)setLive(!live);});

/* ---------- 매 프레임 ---------- */
var lastClk='';
function runSim(G,gid,sd,seen,cnt){
  var c=0;
  G.runs.forEach(function(run){
    for(var d=0;d<2;d++){
      var arr=run.deps[d],T=run.tl[d].T;
      for(var j=0;j<arr.length;j++){
        var dep=arr[j];if(dep>sd)break; var t=sd-dep; if(t>=T)continue; c++;
        if(!G.on)continue;
        var key=run.key+'-'+d+'-'+j,r=trains.get(key)||makeTrain(G,run,d,dep,key);
        seen.add(key);
        var p=posAt(run.tl[d],t);r.p=p; setTrainPos(r,p.lat,p.lng,p.ang*180/Math.PI);
      }
    }
  });
  cnt[gid]=c;
  return c;
}
function frame(ts){
  var now=simNow(),sd=svcSec(now);
  var seen=new Set(),cnt={},tot=0;
  if(live){
    tot+=liveFrame(seen,cnt);
    LINES.forEach(function(G){ if(!G.liveNum) tot+=runSim(G,G.id,sd,seen,cnt); });
  }else{
    LINES.forEach(function(G){ tot+=runSim(G,G.id,sd,seen,cnt); });
  }
  total=tot;
  trains.forEach(function(r,key){
    if(!seen.has(key)){map.removeLayer(r.marker);trains.delete(key);if(sel===key){sel=null;follow=false;sheetKey='';}}
  });
  if(follow&&sel&&trains.has(sel)){
    map.panTo(trains.get(sel).marker.getLatLng(),{animate:false});
  }
  var dt=new Date(now+9*3600000),cl=pad(dt.getUTCHours())+':'+pad(dt.getUTCMinutes())+':'+pad(dt.getUTCSeconds());
  if(cl!==lastClk){lastClk=cl;$('#clk').textContent=cl;$('#clkNote').textContent='KST · '+(live?'실시간 데이터':(scale===1?'실제 속도':'×'+scale+' 배속'));}
  if(ts-lastUI>250){
    lastUI=ts;
    LINES.forEach(function(G){var e=$('#cnt'+G.id);if(e)e.textContent=cnt[G.id]||0;});
    updateSheet();
  }
  requestAnimationFrame(frame);
}
})();
</script>
