name: 축제 API 응답 확인 (수동)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 축제 응답 구조 확인
        env:
          TOURAPI_KEY: ${{ secrets.TOURAPI_KEY }}
        run: python scripts/festival_probe.py
