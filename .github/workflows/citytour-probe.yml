name: 시티투어 API 응답 확인 (수동)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 시티투어 응답 확인
        env:
          CITYTOUR_KEY: ${{ secrets.CITYTOUR_KEY }}
        run: python scripts/citytour_probe.py
