name: 오디 API 응답 확인 (수동)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 오디·영문 API 응답 구조 확인
        env:
          ODII_KEY: ${{ secrets.ODII_KEY }}
          TOURAPI_KEY: ${{ secrets.TOURAPI_KEY }}
        run: python scripts/odii_probe.py
