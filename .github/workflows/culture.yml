name: 문체부 문화행사 갱신

on:
  schedule:
    - cron: "48 16 * * *"   # 매일 한국시간 01:48
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  culture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 전국 문체부 문화행사 정보
        env:
          CULTURE_KEY: ${{ secrets.CULTURE_KEY }}
        run: python scripts/culture.py
      - name: 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/culture.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "문화행사 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi
