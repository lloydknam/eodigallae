name: 인파지도 홍보 영상

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["promo/record.mjs", ".github/workflows/promo.yml"]

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: 준비
        run: |
          npm i --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji
      - name: 사이트 띄우고 녹화
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 2
          node promo/record.mjs
      - name: 영상 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add promo/crowd-map.mp4
          git commit -m "인파지도 홍보 영상"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
