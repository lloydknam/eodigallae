name: 인파지도(서울)

on:
  schedule:
    - cron: "13,43 * * * *"   # 30분마다 (정각·30분은 GitHub가 몰려 자주 밀려서 13분·43분)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/live.py", ".github/workflows/live.yml"]

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: 서울 실시간 인구 받기
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python scripts/live.py
      - name: 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "인파지도 $(TZ=Asia/Seoul date +'%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
