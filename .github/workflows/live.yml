name: 인파지도(서울)

# GitHub Actions가 10분마다 한 번 실행되어 서울시 실시간 인구를 수집하고 JSON을 갱신한다.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/live.py", ".github/workflows/live.yml"]

permissions:
  contents: write
  actions: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: 10분마다 서울 실시간 인구 받기
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          LIVE_LOOP_MIN: "1"
          LIVE_EVERY_MIN: "10"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/live.py
