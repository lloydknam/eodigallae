      const y = (event.touches ? event.touches[0].clientY : event.clientY) - box.top;
      tip.innerHTML = `${i.n}<small>${LABEL[i.r]}</small>`;
      tip.style.left = x + 'px'; tip.style.top = y + 'px'; tip.style.display = 'block';
    })
    .on('mouseleave', () => { tip.style.display = 'none'; });
}).catch(() => { document.getElementById('err').textContent = '지도 데이터를 불러오지 못했습니다.'; });
</script>
</body>
</html>
